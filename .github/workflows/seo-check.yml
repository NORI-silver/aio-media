# SEO・AIOの自動チェック。ルールは AGENTS.md、中身は tools/seo_check.py。
# PR ごとに走る。content/ を直したのに tools/build.py を実行し忘れていても赤くなる。
name: SEO check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build is up to date
        run: |
          python3 tools/build.py .
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::生成ファイルが古いままです。python3 tools/build.py . を実行してコミットしてください"
            git status --short
            exit 1
          fi
      - name: SEO check
        run: python3 tools/seo_check.py . | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash
