<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" role="img" aria-label="Search Consoleはサイトの通知表のようなもの:検索に何回出たか、何回クリックされたか、何番目に出たか、困っていることはないかがわかる"><defs><marker id="ah-search-console-report" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">検索に何回出た?(表示回数)</text><text class="f-s" x="60" y="52">どんな言葉で検索されたときに出たか</text><rect class="f-b" x="16" y="74" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="96" r="12"/><text class="f-numt" x="38" y="100.5" text-anchor="middle">2</text><text class="f-t" x="60" y="99">何回クリックされた?(クリック数)</text><text class="f-s" x="60" y="120">出たうち、何人が選んでくれたか</text><rect class="f-p" x="16" y="142" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="164" r="12"/><text class="f-numt" x="38" y="168.5" text-anchor="middle">3</text><text class="f-t" x="60" y="167">何番目に出た?(平均掲載順位)</text><text class="f-s" x="60" y="188">上から数えて何番目くらいか</text><rect class="f-o" x="16" y="210" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">4</text><text class="f-t" x="60" y="235">困っていることはない?</text><text class="f-s" x="60" y="256">Googleに登録されていないページ・エラー</text></svg>
