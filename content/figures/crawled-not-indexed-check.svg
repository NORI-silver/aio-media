<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" role="img" aria-label="「クロール済み - インデックス未登録」のページを見つけたときの確かめ方:そのページは大事か、URL検査で状態を見る、ブロックやnoindexがないか、ほかのページと中身がかぶっていないか、内部リンクがあるか、の順"><defs><marker id="ah-crawled-not-indexed-check" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">そのページは本当に大事?</text><text class="f-s" x="60" y="52">タグ一覧・検索結果ページなどなら気にしない</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-crawled-not-indexed-check)"/><rect class="f-b" x="16" y="90" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">URL 検査で状態を見る</text><text class="f-s" x="60" y="136">最終クロール日・正規URL・公開URLのテスト</text><line class="f-ar" x1="180.0" y1="150" x2="180.0" y2="170" marker-end="url(#ah-crawled-not-indexed-check)"/><rect class="f-b" x="16" y="174" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="196" r="12"/><text class="f-numt" x="38" y="200.5" text-anchor="middle">3</text><text class="f-t" x="60" y="199">ブロックしていない?</text><text class="f-s" x="60" y="220">robots.txt・noindex・ログインが必要など</text><line class="f-ar" x1="180.0" y1="234" x2="180.0" y2="254" marker-end="url(#ah-crawled-not-indexed-check)"/><rect class="f-p" x="16" y="258" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="280" r="12"/><text class="f-numt" x="38" y="284.5" text-anchor="middle">4</text><text class="f-t" x="60" y="283">中身がほかとかぶっていない?</text><text class="f-s" x="60" y="304">そのページにしかない答え・情報があるか</text><line class="f-ar" x1="180.0" y1="318" x2="180.0" y2="338" marker-end="url(#ah-crawled-not-indexed-check)"/><rect class="f-g" x="16" y="342" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="364" r="12"/><text class="f-numt" x="38" y="368.5" text-anchor="middle">5</text><text class="f-t" x="60" y="367">サイトの中からリンクしている?</text><text class="f-s" x="60" y="388">関連する記事から1〜2本つなぐ</text></svg>
