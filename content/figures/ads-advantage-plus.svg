<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" role="img" aria-label="Advantage+のしくみ:人は目的・計測・素材・守る条件を決め、AIがオーディエンス・配置・予算の3つを担当する。3つすべてを任せるとAdvantage+キャンペーンになる"><defs><marker id="ah-ads-advantage-plus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="94" rx="12"/><text class="f-t" x="30" y="31">人が決める</text><text class="f-s" x="30" y="52">目的(売上・リードなど)と成果の計測</text><text class="f-s" x="30" y="70">素材(画像・動画・文章)</text><text class="f-s" x="30" y="88">守る条件(地域・最低年齢など)</text><line class="f-ar" x1="180.0" y1="102" x2="180.0" y2="122" marker-end="url(#ah-ads-advantage-plus)"/><rect class="f-p" x="16" y="126" width="328" height="150" rx="12"/><text class="f-t" x="30" y="151">AIに任せる3つ</text><rect class="f-w" x="28.0" y="164" width="97.33333333333333" height="66" rx="10"/><text class="f-t2" x="76.66666666666666" y="190" text-anchor="middle">対象の人</text><text class="f-s2" x="76.66666666666666" y="212" text-anchor="middle">誰に見せるか</text><rect class="f-w" x="131.33333333333331" y="164" width="97.33333333333333" height="66" rx="10"/><text class="f-t2" x="179.99999999999997" y="190" text-anchor="middle">配置</text><text class="f-s2" x="179.99999999999997" y="212" text-anchor="middle">どこに出すか</text><rect class="f-w" x="234.66666666666666" y="164" width="97.33333333333333" height="66" rx="10"/><text class="f-t2" x="283.3333333333333" y="190" text-anchor="middle">予算</text><text class="f-s2" x="283.3333333333333" y="212" text-anchor="middle">どの広告セット</text><text class="f-l" x="28" y="258">3つすべてONで「Advantage+ キャンペーン」</text><line class="f-ar" x1="180.0" y1="278" x2="180.0" y2="298" marker-end="url(#ah-ads-advantage-plus)"/><rect class="f-g" x="16" y="302" width="328" height="58" rx="12"/><text class="f-t" x="30" y="327">人が確かめる</text><text class="f-s" x="30" y="348">配置別・年齢別の成果、既存客と新規客の割合</text></svg>
