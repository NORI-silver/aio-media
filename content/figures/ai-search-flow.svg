<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="AI検索が答えを作る5ステップ:質問を聞く、小さな質問に分ける、ページをさがして読む、自分の言葉でまとめる、どこに書いてあったかをそえる"><defs><marker id="ah-ai-search-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">質問を聞く</text><text class="f-s" x="60" y="52">「AIO対策って何から始めればいい?」</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-ai-search-flow)"/><rect class="f-b" x="16" y="90" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">小さな質問に分ける</text><text class="f-s" x="60" y="136">1つの質問を、いくつかの</text><text class="f-s" x="60" y="154">小さな質問にばらす</text><line class="f-ar" x1="180.0" y1="168" x2="180.0" y2="188" marker-end="url(#ah-ai-search-flow)"/><rect class="f-p" x="16" y="192" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="214" r="12"/><text class="f-numt" x="38" y="218.5" text-anchor="middle">3</text><text class="f-t" x="60" y="217">ページをさがして読む</text><text class="f-s" x="60" y="238">Googleと同じように作ったメモ帳から</text><text class="f-s" x="60" y="256">合うページをさがして読む</text><line class="f-ar" x1="180.0" y1="270" x2="180.0" y2="290" marker-end="url(#ah-ai-search-flow)"/><rect class="f-p" x="16" y="294" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="316" r="12"/><text class="f-numt" x="38" y="320.5" text-anchor="middle">4</text><text class="f-t" x="60" y="319">自分の言葉でまとめる</text><text class="f-s" x="60" y="340">読んだページの内容をもとに</text><text class="f-s" x="60" y="358">文章で答えを書く</text><line class="f-ar" x1="180.0" y1="372" x2="180.0" y2="392" marker-end="url(#ah-ai-search-flow)"/><rect class="f-g" x="16" y="396" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="418" r="12"/><text class="f-numt" x="38" y="422.5" text-anchor="middle">5</text><text class="f-t" x="60" y="421">どこに書いてあったかをそえる</text><text class="f-s" x="60" y="442">使ったページのリンク(出典)をのせる</text><text class="f-s" x="60" y="460">→ ここにのることを「引用」という</text></svg>
