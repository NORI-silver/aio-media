<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="AI検索が答えを作る流れ:質問を受け取り、小さな検索に分け、索引からページを探して読み、答えを作り、出典リンクを付けて返す"><defs><marker id="ah-ai-search-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">質問を受け取る</text><text class="f-s" x="60" y="52">例:「AIO対策は何から始める?」</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-ai-search-flow)"/><rect class="f-b" x="16" y="90" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">小さな検索に分ける</text><text class="f-s" x="60" y="136">「AIOとは」「robots.txt 設定」など</text><text class="f-s" x="60" y="154">(クエリ ファンアウト)</text><line class="f-ar" x1="180.0" y1="168" x2="180.0" y2="188" marker-end="url(#ah-ai-search-flow)"/><rect class="f-p" x="16" y="192" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="214" r="12"/><text class="f-numt" x="38" y="218.5" text-anchor="middle">3</text><text class="f-t" x="60" y="217">ページを探して読む</text><text class="f-s" x="60" y="238">事前に作った検索の索引から探す</text><text class="f-s" x="60" y="256">必要ならその場でページを取得</text><line class="f-ar" x1="180.0" y1="270" x2="180.0" y2="290" marker-end="url(#ah-ai-search-flow)"/><rect class="f-p" x="16" y="294" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="316" r="12"/><text class="f-numt" x="38" y="320.5" text-anchor="middle">4</text><text class="f-t" x="60" y="319">答えを作る</text><text class="f-s" x="60" y="340">集めたページの内容をもとに</text><text class="f-s" x="60" y="358">AIが文章をまとめる</text><line class="f-ar" x1="180.0" y1="372" x2="180.0" y2="392" marker-end="url(#ah-ai-search-flow)"/><rect class="f-g" x="16" y="396" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="418" r="12"/><text class="f-numt" x="38" y="422.5" text-anchor="middle">5</text><text class="f-t" x="60" y="421">出典つきで返す</text><text class="f-s" x="60" y="442">使ったページへのリンクを表示</text><text class="f-s" x="60" y="460">→ ここに載ると「引用された」</text></svg>
