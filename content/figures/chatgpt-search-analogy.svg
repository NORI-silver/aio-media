<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" role="img" aria-label="ChatGPT検索を物知りの友だちにたとえた対応表:物知りの友だちはChatGPT、覚えていることで答えるのは学習した知識での答え、最新のことはその場でスマホで調べるのはウェブ検索、検索サービスで見つけたページを読むのは外部の検索サービスとOAI-SearchBotの情報を使うこと、読んだページを見せながら答えるのは出典リンクつきの答え"><defs><marker id="ah-chatgpt-search-analogy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">友だちでは</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">ChatGPTでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="87" text-anchor="middle">物知りの友だち</text><text class="f-t2" x="269.0" y="87" text-anchor="middle">ChatGPT</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="136" text-anchor="middle">覚えていることで</text><text class="f-s2" x="91.0" y="154" text-anchor="middle">そのまま答える</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">学習した知識で</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">答える</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">「最新のことは</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">調べるね」</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">ウェブ検索を使う</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">(自動か、自分で押す)</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">検索して見つけた</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">お店のページを読む</text><text class="f-t2" x="269.0" y="252" text-anchor="middle">検索サービスと</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">OAI-SearchBotの情報</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text><rect class="f-w" x="16" y="288" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="288" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="310" text-anchor="middle">「ここに書いてあった」</text><text class="f-s2" x="91.0" y="328" text-anchor="middle">と画面を見せる</text><text class="f-t2" x="269.0" y="310" text-anchor="middle">出典リンクつきの</text><text class="f-s2" x="269.0" y="328" text-anchor="middle">答え(引用)</text><text class="f-t" x="180.0" y="319" text-anchor="middle">=</text></svg>
