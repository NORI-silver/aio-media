<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img" aria-label="MCPサーバーがAIにわたせる3つのもの:やってくれること(ツール)、読める資料(リソース)、お願いのひな形(プロンプト)"><defs><marker id="ah-mcp-three-things" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">やってくれること(ツール)</text><text class="f-s" x="60" y="52">AIが「これやって」と呼び出せる操作</text><text class="f-s" x="60" y="70">例:ページの登録状況を調べる</text><rect class="f-p" x="16" y="92" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="114" r="12"/><text class="f-numt" x="38" y="118.5" text-anchor="middle">2</text><text class="f-t" x="60" y="117">読める資料(リソース)</text><text class="f-s" x="60" y="138">AIが読んで参考にできるデータ</text><text class="f-s" x="60" y="156">例:サイトの記事の一覧</text><rect class="f-g" x="16" y="178" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="200" r="12"/><text class="f-numt" x="38" y="204.5" text-anchor="middle">3</text><text class="f-t" x="60" y="203">お願いのひな形(プロンプト)</text><text class="f-s" x="60" y="224">よく使うお願いの決まった形</text><text class="f-s" x="60" y="242">例:「月のまとめを作って」</text></svg>
