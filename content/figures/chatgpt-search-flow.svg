<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" role="img" aria-label="ChatGPT検索が答えるまでの流れ:利用者が質問する、ChatGPTが調べる必要があるかを決める(検索ボタンで自分で選ぶこともできる)、外部の検索サービスやOAI-SearchBotが集めた情報からページを探す、ページを読んで答えを書き出典リンクをそえる、リンクを押すとutm_source=chatgpt.comが付いてサイトに来る"><defs><marker id="ah-chatgpt-search-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">利用者が質問する</text><text class="f-s" x="60" y="52">例:夜でも開いている動物病院は?</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-chatgpt-search-flow)"/><rect class="f-b" x="16" y="90" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">調べる必要があるかを決める</text><text class="f-s" x="60" y="136">ChatGPT が決める。自分で</text><text class="f-s" x="60" y="154">検索ボタンを押すこともできる</text><line class="f-ar" x1="180.0" y1="168" x2="180.0" y2="188" marker-end="url(#ah-chatgpt-search-flow)"/><rect class="f-b" x="16" y="192" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="214" r="12"/><text class="f-numt" x="38" y="218.5" text-anchor="middle">3</text><text class="f-t" x="60" y="217">ページを探す</text><text class="f-s" x="60" y="238">外部の検索サービスと</text><text class="f-s" x="60" y="256">OAI-SearchBot が集めた情報</text><line class="f-ar" x1="180.0" y1="270" x2="180.0" y2="290" marker-end="url(#ah-chatgpt-search-flow)"/><rect class="f-g" x="16" y="294" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="316" r="12"/><text class="f-numt" x="38" y="320.5" text-anchor="middle">4</text><text class="f-t" x="60" y="319">読んで答え、出典リンクをそえる</text><text class="f-s" x="60" y="340">ここで自分のページが出る=引用</text><line class="f-ar" x1="180.0" y1="354" x2="180.0" y2="374" marker-end="url(#ah-chatgpt-search-flow)"/><rect class="f-w" x="16" y="378" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="400" r="12"/><text class="f-numt" x="38" y="404.5" text-anchor="middle">5</text><text class="f-t" x="60" y="403">リンクが押されるとサイトに来る</text><text class="f-s" x="60" y="424">URL に utm_source=chatgpt.com</text></svg>
