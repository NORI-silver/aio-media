<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 648" role="img" aria-label="LLMO対策のチェックリスト10項目:読まれる土台としてrobots.txtでボットを止めていない、インデックスにのり説明文を止めていない、Search Consoleの生成AI設定が含める、本文が最初のHTMLにある。選ばれる中身として冒頭で答える、見出しで整理、自分だけの情報、だれが書いたかと更新日、図や画像。最後にAIの答えで確かめる"><defs><marker id="ah-llmo-checklist" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><text class="f-t" x="30" y="31">1. ボットを止めていない</text><text class="f-s" x="30" y="52">/robots.txt を開いて確かめる</text><rect class="f-o" x="16" y="70" width="328" height="58" rx="12"/><text class="f-t" x="30" y="95">2. インデックスにのり、説明文を出せる</text><text class="f-s" x="30" y="116">Search Console の URL 検査</text><rect class="f-o" x="16" y="134" width="328" height="58" rx="12"/><text class="f-t" x="30" y="159">3. 生成AI設定が「含める」</text><text class="f-s" x="30" y="180">Search Console の設定</text><rect class="f-o" x="16" y="198" width="328" height="58" rx="12"/><text class="f-t" x="30" y="223">4. 本文が最初のHTMLにある</text><text class="f-s" x="30" y="244">ページのソースに本文の文があるか</text><rect class="f-b" x="16" y="262" width="328" height="58" rx="12"/><text class="f-t" x="30" y="287">5. 最初の1〜2文で答えている</text><text class="f-s" x="30" y="308">前置きから始めていないか</text><rect class="f-b" x="16" y="326" width="328" height="58" rx="12"/><text class="f-t" x="30" y="351">6. 見出しと段落で整理している</text><text class="f-s" x="30" y="372">見出しだけ読んで中身がわかるか</text><rect class="f-p" x="16" y="390" width="328" height="58" rx="12"/><text class="f-t" x="30" y="415">7. 自分だけの情報がある</text><text class="f-s" x="30" y="436">試した結果・実際の数字・失敗例</text><rect class="f-p" x="16" y="454" width="328" height="58" rx="12"/><text class="f-t" x="30" y="479">8. だれが書いたか・更新日が見える</text><text class="f-s" x="30" y="500">運営者のページへリンクしているか</text><rect class="f-p" x="16" y="518" width="328" height="58" rx="12"/><text class="f-t" x="30" y="543">9. 図・画像・表がある</text><text class="f-s" x="30" y="564">文章だけで説明していないか</text><rect class="f-g" x="16" y="582" width="328" height="58" rx="12"/><text class="f-t" x="30" y="607">10. AIの答えで確かめる</text><text class="f-s" x="30" y="628">生成AIのレポートと、実際の質問</text></svg>
