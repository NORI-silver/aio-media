<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" role="img" aria-label="AIモードに自分のページが出るための4つの関門:Googleのボットが読める、インデックスに登録されている、説明文(スニペット)を出せる、Search Consoleの検索の生成AIの設定が含めるになっている"><defs><marker id="ah-ai-mode-gates" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">ボットが読める</text><text class="f-s" x="60" y="52">robots.txt で Googlebot を止めない</text><rect class="f-b" x="16" y="74" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="96" r="12"/><text class="f-numt" x="38" y="100.5" text-anchor="middle">2</text><text class="f-t" x="60" y="99">インデックスに登録ずみ</text><text class="f-s" x="60" y="120">URL 検査で「登録されています」</text><rect class="f-b" x="16" y="142" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="164" r="12"/><text class="f-numt" x="38" y="168.5" text-anchor="middle">3</text><text class="f-t" x="60" y="167">説明文を出せる</text><text class="f-s" x="60" y="188">nosnippet・max-snippet:0 を付けない</text><rect class="f-g" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">4</text><text class="f-t" x="60" y="235">生成AIの設定が「含める」</text><text class="f-s" x="60" y="256">Search Console の 設定 &gt;</text><text class="f-s" x="60" y="274">検索の生成AI(最初から含める)</text></svg>
