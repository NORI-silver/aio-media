<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 434" role="img" aria-label="サイトへのアクセス4種類:人の閲覧、AIクローラー、AIがユーザーの代わりに取りに来るアクセス、AIの回答のリンクから来る人。それぞれサーバーログとGA4での見え方が違う"><defs><marker id="ah-ai-human-access" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-g" x="16" y="6" width="328" height="96" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">人がブラウザで見る</text><text class="f-s" x="60" y="52">検索・SNS・直接アクセスなど</text><text class="f-s" x="60" y="70">JavaScriptも画像も読み込む</text><text class="f-l" x="60" y="90">▸ ログ:残る / GA4:記録される</text><rect class="f-o" x="16" y="114" width="328" height="96" rx="12"/><circle class="f-num" cx="38" cy="136" r="12"/><text class="f-numt" x="38" y="140.5" text-anchor="middle">2</text><text class="f-t" x="60" y="139">AIクローラー</text><text class="f-s" x="60" y="160">GPTBot・ClaudeBot・OAI-SearchBotなど</text><text class="f-s" x="60" y="178">学習や検索の索引のために巡回</text><text class="f-l" x="60" y="198">▸ ログ:残る / GA4:ふつう記録されない</text><rect class="f-p" x="16" y="222" width="328" height="96" rx="12"/><circle class="f-num" cx="38" cy="244" r="12"/><text class="f-numt" x="38" y="248.5" text-anchor="middle">3</text><text class="f-t" x="60" y="247">AIがユーザーの代わりに取得</text><text class="f-s" x="60" y="268">ChatGPT-User・Claude-Userなど</text><text class="f-s" x="60" y="286">質問されたその場でページを読む</text><text class="f-l" x="60" y="306">▸ ログ:残る / GA4:ふつう記録されない</text><rect class="f-b" x="16" y="330" width="328" height="96" rx="12"/><circle class="f-num" cx="38" cy="352" r="12"/><text class="f-numt" x="38" y="356.5" text-anchor="middle">4</text><text class="f-t" x="60" y="355">AIの回答から来た人</text><text class="f-s" x="60" y="376">ChatGPTなどの出典リンクをクリック</text><text class="f-s" x="60" y="394">ふつうのブラウザで見る</text><text class="f-l" x="60" y="414">▸ ログ:残る / GA4:参照元つきで記録</text></svg>
