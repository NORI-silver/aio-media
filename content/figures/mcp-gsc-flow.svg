<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" role="img" aria-label="MCPでAIがSearch Consoleを使う流れ:質問する、AIが道具をえらぶ、MCPサーバーがデータを取りに行く、結果をAIにわたす、AIが答える"><defs><marker id="ah-mcp-gsc-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">人がAIに聞く</text><text class="f-s" x="60" y="52">「このページ、Googleに登録された?」</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-mcp-gsc-flow)"/><rect class="f-b" x="16" y="90" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">AIが道具をえらぶ</text><text class="f-s" x="60" y="136">道具の一覧から</text><text class="f-s" x="60" y="154">「登録状況を調べる」をえらぶ</text><line class="f-ar" x1="180.0" y1="168" x2="180.0" y2="188" marker-end="url(#ah-mcp-gsc-flow)"/><rect class="f-p" x="16" y="192" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="214" r="12"/><text class="f-numt" x="38" y="218.5" text-anchor="middle">3</text><text class="f-t" x="60" y="217">MCPサーバーが取りに行く</text><text class="f-s" x="60" y="238">Search Consoleにたずねる</text><text class="f-s" x="60" y="256">(人が許可した範囲だけ)</text><line class="f-ar" x1="180.0" y1="270" x2="180.0" y2="290" marker-end="url(#ah-mcp-gsc-flow)"/><rect class="f-p" x="16" y="294" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="316" r="12"/><text class="f-numt" x="38" y="320.5" text-anchor="middle">4</text><text class="f-t" x="60" y="319">結果をAIにわたす</text><text class="f-s" x="60" y="340">「登録ずみ」「まだ」などの答え</text><line class="f-ar" x1="180.0" y1="354" x2="180.0" y2="374" marker-end="url(#ah-mcp-gsc-flow)"/><rect class="f-g" x="16" y="378" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="400" r="12"/><text class="f-numt" x="38" y="404.5" text-anchor="middle">5</text><text class="f-t" x="60" y="403">AIがわかりやすく答える</text><text class="f-s" x="60" y="424">「トップは登録ずみ、記事はまだです」</text></svg>
