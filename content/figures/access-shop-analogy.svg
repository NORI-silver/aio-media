<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" role="img" aria-label="サイトへのアクセス4種類をお店にたとえると:人の閲覧はお客さん、AIクローラーはガイドブックの取材の人、AIのユーザー代理の取得はお使いの人、AI経由の人はガイドブックを見て来たお客さん"><defs><marker id="ah-access-shop-analogy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">お店では</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">サイトでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="78" text-anchor="middle">お客さん</text><text class="f-s2" x="91.0" y="96" text-anchor="middle">自分で来て見る</text><text class="f-t2" x="269.0" y="78" text-anchor="middle">人の閲覧</text><text class="f-s2" x="269.0" y="96" text-anchor="middle">ブラウザで見る</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="136" text-anchor="middle">取材の人</text><text class="f-s2" x="91.0" y="154" text-anchor="middle">ガイドブックのため</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">AIクローラー</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">学習・検索の準備</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">お使いの人</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">人に頼まれて来る</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">AIのその場の取得</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">質問されて読みに来る</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">紹介で来た人</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">ガイドブックを見て</text><text class="f-t2" x="269.0" y="252" text-anchor="middle">AI経由の人</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">AIの答えのリンクから</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text></svg>
