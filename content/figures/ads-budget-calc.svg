<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" role="img" aria-label="広告予算の逆算:目標の件数20件と許容CPA1万円を掛けると月の広告予算20万円。許容CPAは1件の利益と成約率から決める"><defs><marker id="ah-ads-budget-calc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="146.0" height="84" rx="12"/><text class="f-s2" x="89.0" y="30" text-anchor="middle">目標の件数(月)</text><text class="f-t" x="89.0" y="60" text-anchor="middle">20件</text><text class="f-s2" x="89.0" y="80" text-anchor="middle">問い合わせなど</text><text class="f-t" x="180.0" y="56" text-anchor="middle">×</text><rect class="f-b" x="198.0" y="6" width="146.0" height="84" rx="12"/><text class="f-s2" x="271.0" y="30" text-anchor="middle">許容CPA</text><text class="f-t" x="271.0" y="60" text-anchor="middle">1万円</text><text class="f-s2" x="271.0" y="80" text-anchor="middle">1件の上限</text><line class="f-ar" x1="180.0" y1="94" x2="180.0" y2="118" marker-end="url(#ah-ads-budget-calc)"/><rect class="f-g" x="16" y="122" width="328" height="70" rx="12"/><text class="f-s2" x="180.0" y="146" text-anchor="middle">月の広告予算</text><text class="f-t" x="180.0" y="172" text-anchor="middle">20万円(1日 約6,600円)</text><rect class="f-w" x="16" y="204" width="328" height="78" rx="12"/><text class="f-t" x="30" y="229">許容CPAの決め方</text><text class="f-s" x="30" y="250">1件の成約で残る利益 × 成約する割合</text><text class="f-s" x="30" y="268">例:5万円 × 20% = 1万円(数字は例)</text></svg>
