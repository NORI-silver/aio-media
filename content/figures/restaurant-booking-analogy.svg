<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" role="img" aria-label="AIモードのレストラン予約を町の案内所にたとえた対応表:案内所の係の人はAIモード、お店の予約帳を預かる受付は予約サイト(ぐるなび・一休・ebica)、予約帳の空きは空席情報、係の人に伝える希望は人数・日時・場所・料理、予約するのはお客さん自身"><defs><marker id="ah-restaurant-booking-analogy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">町の案内所では</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">AIモードでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="87" text-anchor="middle">案内所の係の人</text><text class="f-t2" x="269.0" y="87" text-anchor="middle">Google の AIモード</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="145" text-anchor="middle">予約帳を預かる受付</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">予約サイト</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">(ぐるなび・一休・ebica)</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="203" text-anchor="middle">予約帳の空き</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">空席の情報</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">(その時点のもの)</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">「4人で金曜7時</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">渋谷で焼き鳥」</text><text class="f-t2" x="269.0" y="252" text-anchor="middle">人数・日時・場所</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">料理のジャンル</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text><rect class="f-w" x="16" y="288" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="288" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="310" text-anchor="middle">受付で名前を書く</text><text class="f-s2" x="91.0" y="328" text-anchor="middle">のはお客さん</text><text class="f-t2" x="269.0" y="310" text-anchor="middle">予約ページで</text><text class="f-s2" x="269.0" y="328" text-anchor="middle">自分で予約する</text><text class="f-t" x="180.0" y="319" text-anchor="middle">=</text></svg>
