<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" role="img" aria-label="会社のAI利用から情報が漏れる3つのパターン:店が知らない外の人に名簿を見せる(会社が認めていないAIに入力)、お手伝いさんの合鍵を盗まれる(AIの権限を盗まれる)、お手伝いさんがニセの指示メモに従う(AIがかくれた命令に従う)"><defs><marker id="ah-leak-ai-own-use" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">店が知らない人に名簿を見せる</text><text class="f-s" x="60" y="52">会社が認めていないAIに</text><text class="f-s" x="60" y="70">お客さんの名簿や資料を貼りつける</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-leak-ai-own-use)"/><rect class="f-o" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">お手伝いさんの合鍵を盗まれる</text><text class="f-s" x="60" y="154">AIにわたした権限(トークン)を</text><text class="f-s" x="60" y="172">盗まれ、勝手に使われる</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-leak-ai-own-use)"/><rect class="f-o" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">お手伝いさんがニセの指示に従う</text><text class="f-s" x="60" y="256">メールやページにかくれた命令に</text><text class="f-s" x="60" y="274">AIが従ってしまう</text></svg>
