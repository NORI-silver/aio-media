<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 416" role="img" aria-label="2026年10月15日にGoogleが発表した5つの変更:文中のリンクを増やす、公式サイトの欄をテスト、ニュースのカルーセルを広げる、関連記事のリンクに画像をつける、動画の作り手の名前からプロフィールへ(AIモードでテスト)"><defs><marker id="ah-ai-links-five-changes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">文中のリンクが増える</text><text class="f-s" x="60" y="52">答えの文の中にリンクを多く、</text><text class="f-s" x="60" y="70">上のほうにも出しやすく</text><rect class="f-p" x="16" y="92" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="114" r="12"/><text class="f-numt" x="38" y="118.5" text-anchor="middle">2</text><text class="f-t" x="60" y="117">公式サイトの欄(テスト)</text><text class="f-s" x="60" y="138">公式サイトが1〜2つしかない用事で、</text><text class="f-s" x="60" y="156">答えの最初に理由つきでのせる</text><rect class="f-b" x="16" y="178" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="200" r="12"/><text class="f-numt" x="38" y="204.5" text-anchor="middle">3</text><text class="f-t" x="60" y="203">ニュースのカルーセルを拡大</text><text class="f-s" x="60" y="224">新しい記事を横に並べる枠を</text><text class="f-s" x="60" y="242">ほかの国・言語にも広げる</text><rect class="f-b" x="16" y="264" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="286" r="12"/><text class="f-numt" x="38" y="290.5" text-anchor="middle">4</text><text class="f-t" x="60" y="289">関連記事のリンクに画像</text><text class="f-s" x="60" y="310">答えの最後のリンクに</text><text class="f-s" x="60" y="328">小さな画像がつき押しやすく</text><rect class="f-p" x="16" y="350" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="372" r="12"/><text class="f-numt" x="38" y="376.5" text-anchor="middle">5</text><text class="f-t" x="60" y="375">作り手の名前からプロフィールへ</text><text class="f-s" x="60" y="396">AIモードの動画の結果でテスト中</text></svg>
