<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 316" role="img" aria-label="検索結果の1件を本屋の本にたとえると:タイトルは本の題名、説明文は帯の紹介文、URLは本棚の場所"><defs><marker id="ah-search-result-parts" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-w" x="16" y="6" width="328" height="116" rx="12"/><text class="f-s2" x="30" y="32">aio.shiokonbu.com › seo</text><text class="f-l" x="30" y="58">タイトルとmeta descriptionの書き方</text><text class="f-s2" x="30" y="84">検索結果に出るタイトルと説明文の書き方を、</text><text class="f-s2" x="30" y="102">Googleの公式ガイドをもとに解説…</text><rect class="f-b" x="16" y="136" width="328" height="52" rx="12"/><text class="f-t2" x="30" y="158">URL</text><text class="f-s2" x="30" y="177">= 本棚の場所(どのサイトのどこにあるか)</text><rect class="f-p" x="16" y="196" width="328" height="52" rx="12"/><text class="f-t2" x="30" y="218">タイトル</text><text class="f-s2" x="30" y="237">= 本の題名(何のページかを一言で)</text><rect class="f-g" x="16" y="256" width="328" height="52" rx="12"/><text class="f-t2" x="30" y="278">説明文(meta description)</text><text class="f-s2" x="30" y="297">= 帯の紹介文(読むかどうか決める材料)</text></svg>
