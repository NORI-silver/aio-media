<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" role="img" aria-label="お客さんの質問を1ページにする型:見出しは質問の形、最初の2文で答える、自社の実例を見せる、料金の目安と対応地域、最後に連絡のしかた"><defs><marker id="ah-sb-seo-question-page" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">見出しは「質問」の形</text><text class="f-s" x="60" y="52">お客さんが使った言葉そのままで</text><rect class="f-b" x="16" y="74" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="96" r="12"/><text class="f-numt" x="38" y="100.5" text-anchor="middle">2</text><text class="f-t" x="60" y="99">最初の2文で答える</text><text class="f-s" x="60" y="120">「〜です。理由は〜」と言い切る</text><rect class="f-p" x="16" y="142" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="164" r="12"/><text class="f-numt" x="38" y="168.5" text-anchor="middle">3</text><text class="f-t" x="60" y="167">自社の実例を見せる</text><text class="f-s" x="60" y="188">写真・かかった日数・よくある失敗</text><rect class="f-p" x="16" y="210" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">4</text><text class="f-t" x="60" y="235">料金の目安と対応地域</text><text class="f-s" x="60" y="256">「〜円から」「◯◯市・△△市」</text><rect class="f-g" x="16" y="278" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="300" r="12"/><text class="f-numt" x="38" y="304.5" text-anchor="middle">5</text><text class="f-t" x="60" y="303">最後に連絡のしかた</text><text class="f-s" x="60" y="324">電話・フォーム・LINE など</text></svg>
