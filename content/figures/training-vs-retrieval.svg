<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 392" role="img" aria-label="AIがWebページを使う2つの方法の比較:前もって読んで覚えておく学習と、質問されてから調べる検索"><defs><marker id="ah-training-vs-retrieval" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="158.0" height="58" rx="12"/><text class="f-t" x="95.0" y="31" text-anchor="middle">覚えておく</text><text class="f-s2" x="95.0" y="51" text-anchor="middle">(学習)</text><rect class="f-g" x="186.0" y="6" width="158.0" height="58" rx="12"/><text class="f-t" x="265.0" y="31" text-anchor="middle">その場で調べる</text><text class="f-s2" x="265.0" y="51" text-anchor="middle">(検索)</text><text class="f-l" x="16" y="88">たとえると</text><rect class="f-w" x="16" y="94" width="158.0" height="50" rx="12"/><rect class="f-w" x="186.0" y="94" width="158.0" height="50" rx="12"/><text class="f-s2" x="95.0" y="115" text-anchor="middle">係の人が前もって</text><text class="f-s2" x="95.0" y="134" text-anchor="middle">本を読んで覚える</text><text class="f-s2" x="265.0" y="115" text-anchor="middle">質問されてから</text><text class="f-s2" x="265.0" y="134" text-anchor="middle">棚の本を開く</text><text class="f-l" x="16" y="168">いつ読む?</text><rect class="f-w" x="16" y="174" width="158.0" height="50" rx="12"/><rect class="f-w" x="186.0" y="174" width="158.0" height="50" rx="12"/><text class="f-s2" x="95.0" y="195" text-anchor="middle">前もって</text><text class="f-s2" x="95.0" y="214" text-anchor="middle">まとめて読む</text><text class="f-s2" x="265.0" y="195" text-anchor="middle">質問された</text><text class="f-s2" x="265.0" y="214" text-anchor="middle">そのときに読む</text><text class="f-l" x="16" y="248">どこで読んだか</text><rect class="f-w" x="16" y="254" width="158.0" height="50" rx="12"/><rect class="f-w" x="186.0" y="254" width="158.0" height="50" rx="12"/><text class="f-s2" x="95.0" y="275" text-anchor="middle">言えない</text><text class="f-s2" x="95.0" y="294" text-anchor="middle">(リンクなし)</text><text class="f-s2" x="265.0" y="275" text-anchor="middle">言える</text><text class="f-s2" x="265.0" y="294" text-anchor="middle">(リンクあり)</text><text class="f-l" x="16" y="328">サイトに人は</text><rect class="f-w" x="16" y="334" width="158.0" height="50" rx="12"/><rect class="f-w" x="186.0" y="334" width="158.0" height="50" rx="12"/><text class="f-s2" x="95.0" y="364" text-anchor="middle">来ない</text><text class="f-s2" x="265.0" y="355" text-anchor="middle">来ることがある</text><text class="f-s2" x="265.0" y="374" text-anchor="middle">(リンクから)</text></svg>
