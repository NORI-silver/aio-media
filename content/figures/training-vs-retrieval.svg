<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 388" role="img" aria-label="AIがWebの情報を使う2つの経路の比較:学習データとして取り込む経路と、回答のたびに検索して引用する経路"><defs><marker id="ah-training-vs-retrieval" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="158.0" height="46" rx="12"/><text class="f-t" x="30" y="31">① 学習に使う</text><rect class="f-g" x="186.0" y="6" width="158.0" height="46" rx="12"/><text class="f-t" x="200.0" y="31">② 検索して引用</text><text class="f-l" x="16" y="76">クローラー</text><rect class="f-w" x="16" y="82" width="158.0" height="52" rx="12"/><rect class="f-w" x="186.0" y="82" width="158.0" height="52" rx="12"/><text class="f-s2" x="28" y="104">GPTBot</text><text class="f-s2" x="28" y="123">ClaudeBot など</text><text class="f-s2" x="198.0" y="104">OAI-SearchBot</text><text class="f-s2" x="198.0" y="123">PerplexityBot など</text><text class="f-l" x="16" y="158">いつ使う</text><rect class="f-w" x="16" y="164" width="158.0" height="52" rx="12"/><rect class="f-w" x="186.0" y="164" width="158.0" height="52" rx="12"/><text class="f-s2" x="28" y="186">モデルを作るとき</text><text class="f-s2" x="28" y="205">(過去のデータ)</text><text class="f-s2" x="198.0" y="186">質問されたとき</text><text class="f-s2" x="198.0" y="205">(その時点の情報)</text><text class="f-l" x="16" y="240">出典リンク</text><rect class="f-w" x="16" y="246" width="158.0" height="52" rx="12"/><rect class="f-w" x="186.0" y="246" width="158.0" height="52" rx="12"/><text class="f-s2" x="28" y="268">付かない</text><text class="f-s2" x="28" y="287"></text><text class="f-s2" x="198.0" y="268">付く</text><text class="f-s2" x="198.0" y="287">→ サイトに来てもらえる</text><text class="f-l" x="16" y="322">止める方法</text><rect class="f-w" x="16" y="328" width="158.0" height="52" rx="12"/><rect class="f-w" x="186.0" y="328" width="158.0" height="52" rx="12"/><text class="f-s2" x="28" y="350">学習用だけを</text><text class="f-s2" x="28" y="369">robots.txt で拒否</text><text class="f-s2" x="198.0" y="350">検索用を拒否すると</text><text class="f-s2" x="198.0" y="369">AI検索に出なくなる</text></svg>
