<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 454" role="img" aria-label="前と後のくらべ:これまではお客さんが予約サイトを1つずつ開いて空席をさがした。これからはAIモードに条件を伝えると、空席のあるお店だけが一覧で出て、予約ページへのリンクから自分で予約する"><defs><marker id="ah-restaurant-booking-before-after" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-w" x="16" y="6" width="328" height="40" rx="12"/><text class="f-t" x="180.0" y="31" text-anchor="middle">これまで</text><rect class="f-w" x="16" y="54" width="328" height="76" rx="12"/><text class="f-t" x="30" y="79">お客さんが自分で何軒も回る</text><text class="f-s" x="30" y="100">予約サイトを1つずつ開いて日時を入れる</text><text class="f-s" x="30" y="118">満席なら、また次のサイトへ…</text><rect class="f-b" x="16" y="140" width="328" height="40" rx="12"/><text class="f-t" x="180.0" y="165" text-anchor="middle">これから(AIモード)</text><rect class="f-b" x="16" y="190" width="328" height="52" rx="12"/><circle class="f-num" cx="38" cy="212" r="12"/><text class="f-numt" x="38" y="216.5" text-anchor="middle">1</text><text class="f-t" x="60" y="215">条件をまとめて伝える</text><text class="f-s" x="60" y="236">4人・金曜19時・渋谷・焼き鳥</text><line class="f-ar" x1="180.0" y1="243" x2="180.0" y2="255" marker-end="url(#ah-restaurant-booking-before-after)"/><rect class="f-b" x="16" y="258" width="328" height="52" rx="12"/><circle class="f-num" cx="38" cy="280" r="12"/><text class="f-numt" x="38" y="284.5" text-anchor="middle">2</text><text class="f-t" x="60" y="283">AIモードが空席を確かめる</text><text class="f-s" x="60" y="304">いくつもの予約サイトをまとめて</text><line class="f-ar" x1="180.0" y1="311" x2="180.0" y2="323" marker-end="url(#ah-restaurant-booking-before-after)"/><rect class="f-g" x="16" y="326" width="328" height="52" rx="12"/><circle class="f-num" cx="38" cy="348" r="12"/><text class="f-numt" x="38" y="352.5" text-anchor="middle">3</text><text class="f-t" x="60" y="351">空いているお店だけ一覧に</text><text class="f-s" x="60" y="372">予約ページへのリンクつき</text><line class="f-ar" x1="180.0" y1="379" x2="180.0" y2="391" marker-end="url(#ah-restaurant-booking-before-after)"/><rect class="f-b" x="16" y="394" width="328" height="52" rx="12"/><circle class="f-num" cx="38" cy="416" r="12"/><text class="f-numt" x="38" y="420.5" text-anchor="middle">4</text><text class="f-t" x="60" y="419">予約はお客さんが自分で</text><text class="f-s" x="60" y="440">リンク先のページで完了</text></svg>
