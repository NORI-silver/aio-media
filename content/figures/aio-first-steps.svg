<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 362" role="img" aria-label="AI検索で紹介されるために今日からやる5つ:AIのボットを止めない、最初に答えを書く、数字に出典を書く、だれが書いたかを見せる、自分だけの情報を書く"><defs><marker id="ah-aio-first-steps" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">AIのボットを止めない</text><text class="f-s" x="60" y="52">ページを読みに来るプログラムを</text><text class="f-s" x="60" y="70">入口で追い返していないか確かめる</text><rect class="f-b" x="16" y="92" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="114" r="12"/><text class="f-numt" x="38" y="118.5" text-anchor="middle">2</text><text class="f-t" x="60" y="117">最初に答えを書く</text><text class="f-s" x="60" y="138">質問への答えを、ページの1〜2文目に</text><rect class="f-p" x="16" y="160" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="182" r="12"/><text class="f-numt" x="38" y="186.5" text-anchor="middle">3</text><text class="f-t" x="60" y="185">数字には出典と日付</text><text class="f-s" x="60" y="206">「どこで・いつ調べたか」をそえる</text><rect class="f-p" x="16" y="228" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="250" r="12"/><text class="f-numt" x="38" y="254.5" text-anchor="middle">4</text><text class="f-t" x="60" y="253">だれが書いたかを見せる</text><text class="f-s" x="60" y="274">会社名・運営者・連絡先をのせる</text><rect class="f-g" x="16" y="296" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="318" r="12"/><text class="f-numt" x="38" y="322.5" text-anchor="middle">5</text><text class="f-t" x="60" y="321">自分だけの情報を書く</text><text class="f-s" x="60" y="342">試した結果・実際の数字・失敗した話</text></svg>
