<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" role="img" aria-label="人手がない会社の毎月のやること:毎週、口コミに返信する。毎月、質問のページを1〜2本足す。毎月、Search Consoleで表示回数を見る。毎月、問い合わせの数と、何を見て連絡したかを記録する"><defs><marker id="ah-sb-seo-monthly" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">毎週10分:口コミに返信する</text><text class="f-s" x="60" y="52">よい口コミにも、きびしい口コミにも</text><rect class="f-b" x="16" y="74" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="96" r="12"/><text class="f-numt" x="38" y="100.5" text-anchor="middle">2</text><text class="f-t" x="60" y="99">毎月2〜3時間:質問のページを1〜2本</text><text class="f-s" x="60" y="120">書き出した10個の質問から順に</text><rect class="f-p" x="16" y="142" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="164" r="12"/><text class="f-numt" x="38" y="168.5" text-anchor="middle">3</text><text class="f-t" x="60" y="167">毎月15分:Search Console を見る</text><text class="f-s" x="60" y="188">表示回数と、どんな言葉で出たか</text><rect class="f-g" x="16" y="210" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">4</text><text class="f-t" x="60" y="235">毎月15分:問い合わせの数を記録</text><text class="f-s" x="60" y="256">数と「何を見て連絡したか」</text></svg>
