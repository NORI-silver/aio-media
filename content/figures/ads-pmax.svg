<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 382" role="img" aria-label="P-MAXのしくみ:人が目標・予算・素材・ヒントを渡すと、GoogleのAIが検索・YouTube・ディスプレイ・Discover・Gmail・マップに広告を組み立てて配信する"><defs><marker id="ah-ads-pmax" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="94" rx="12"/><text class="f-t" x="30" y="31">あなたが渡すもの</text><text class="f-s" x="30" y="52">目標(成果)と予算</text><text class="f-s" x="30" y="70">素材:見出し・画像・動画・ロゴ</text><text class="f-s" x="30" y="88">ヒント:お客さんのリスト・検索テーマ</text><line class="f-ar" x1="180.0" y1="102" x2="180.0" y2="122" marker-end="url(#ah-ads-pmax)"/><rect class="f-p" x="16" y="126" width="328" height="76" rx="12"/><text class="f-t" x="30" y="151">P-MAX(GoogleのAI)</text><text class="f-s" x="30" y="172">誰に・どこに・いくらで出すかを決め</text><text class="f-s" x="30" y="190">素材を組み合わせて広告を作る</text><line class="f-ar" x1="68.0" y1="204" x2="68.0" y2="222" marker-end="url(#ah-ads-pmax)"/><rect class="f-o" x="16.0" y="226" width="104.0" height="32" rx="8"/><text class="f-t2" x="68.0" y="247" text-anchor="middle">検索</text><line class="f-ar" x1="180.0" y1="204" x2="180.0" y2="222" marker-end="url(#ah-ads-pmax)"/><rect class="f-o" x="128.0" y="226" width="104.0" height="32" rx="8"/><text class="f-t2" x="180.0" y="247" text-anchor="middle">YouTube</text><line class="f-ar" x1="292.0" y1="204" x2="292.0" y2="222" marker-end="url(#ah-ads-pmax)"/><rect class="f-o" x="240.0" y="226" width="104.0" height="32" rx="8"/><text class="f-t2" x="292.0" y="247" text-anchor="middle">ディスプレイ</text><rect class="f-o" x="16.0" y="266" width="104.0" height="32" rx="8"/><text class="f-t2" x="68.0" y="287" text-anchor="middle">Discover</text><rect class="f-o" x="128.0" y="266" width="104.0" height="32" rx="8"/><text class="f-t2" x="180.0" y="287" text-anchor="middle">Gmail</text><rect class="f-o" x="240.0" y="266" width="104.0" height="32" rx="8"/><text