<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 404" role="img" aria-label="AIモードを図書館の相談カウンターにたとえた対応表:相談カウンターはAIモードの画面、長い相談は長い質問、司書さんがいくつもの棚を回るのはクエリファンアウト、本を見せながら答えるのは引用リンクつきの答え、続けての相談は追加の質問、自信がないときの本のリストはリンクの一覧"><defs><marker id="ah-ai-mode-analogy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">図書館では</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">Googleでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="87" text-anchor="middle">相談カウンター</text><text class="f-t2" x="269.0" y="87" text-anchor="middle">AIモードの画面</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="145" text-anchor="middle">こみいった相談</text><text class="f-t2" x="269.0" y="145" text-anchor="middle">長い・細かい質問</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">司書さんが</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">いくつもの棚を回る</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">質問を小分けにして</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">何回も検索</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">本を見せながら</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">答える</text><text class="f-t2" x="269.0" y="252" text-anchor="middle">リンクつきの答え</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">(引用)</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text><rect class="f-w" x="16" y="288" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="288" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="310" text-anchor="middle">「では次は…」</text><text class="f-s2" x="91.0" y="328" text-anchor="middle">と続けて相談</text><text class="f-t2" x="269.0" y="310" text-anchor="middle">追加の質問</text><text class="f-s2" x="269.0" y="328" text-anchor="middle">(新しい検索)</text><text class="f-t" x="180.0" y="319" text-anchor="middle">=</text><rect class="f-w" x="16" y="346" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="346" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="368" text-anchor="middle">自信がない時は</text><text class="f-s2" x="91.0" y="386" text-anchor="middle">本のリストを渡す</text><text class="f-t2" x="269.0" y="377" text-anchor="middle">リンクの一覧を出す</text><text class="f-t" x="180.0" y="377" text-anchor="middle">=</text></svg>
