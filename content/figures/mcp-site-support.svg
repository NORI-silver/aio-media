<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 208" role="img" aria-label="サイトのMCP対応とは、人が見るためのWebページとは別に、AIが使うための窓口(MCPサーバー)を用意すること。検索順位やAIの答えに出ることとは別の話"><defs><marker id="ah-mcp-site-support" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="158.0" height="112" rx="12"/><text class="f-t" x="95.0" y="32" text-anchor="middle">Webページ</text><text class="f-s2" x="95.0" y="56" text-anchor="middle">人が見る入口</text><text class="f-s2" x="95.0" y="75" text-anchor="middle">検索やAIの答えに</text><text class="f-s2" x="95.0" y="94" text-anchor="middle">出るのはこちら</text><rect class="f-p" x="186.0" y="6" width="158.0" height="112" rx="12"/><text class="f-t" x="265.0" y="32" text-anchor="middle">MCPサーバー</text><text class="f-s2" x="265.0" y="56" text-anchor="middle">AIが使う窓口</text><text class="f-s2" x="265.0" y="75" text-anchor="middle">予約・在庫など</text><text class="f-s2" x="265.0" y="94" text-anchor="middle">AIが直接さわれる</text><rect class="f-w" x="16" y="130" width="328" height="70" rx="12"/><text class="f-t" x="30" y="155">MCPに対応しても</text><text class="f-s" x="30" y="176">検索の順位やAIの答えに出やすくはならない</text><text class="f-s" x="30" y="194">→ 出るための工夫はSEOとAIOの基本</text></svg>
