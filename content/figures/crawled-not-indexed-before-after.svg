<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" role="img" aria-label="ヘルプの説明の前と後:前は、いずれ登録されるかもしれない、送り直す必要はない、調べ方と報告先の案内なし。後は、すべてのページを登録するわけではないのでよくあること、必ずしも問題ではない、重要なページならURL検査などで原因を調べる、サイト全体の不具合と思われるときは報告フォーム"><defs><marker id="ah-crawled-not-indexed-before-after" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-w" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">前の説明</text><rect class="f-g" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">今の説明</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="78" text-anchor="middle">いずれ登録される</text><text class="f-s2" x="91.0" y="96" text-anchor="middle">かもしれない</text><text class="f-t2" x="269.0" y="78" text-anchor="middle">全部は登録しない。</text><text class="f-s2" x="269.0" y="96" text-anchor="middle">よくあること</text><text class="f-s2" x="180.0" y="87" text-anchor="middle">→</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="136" text-anchor="middle">送り直す</text><text class="f-s2" x="91.0" y="154" text-anchor="middle">必要はない</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">必ずしも</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">問題ではない</text><text class="f-s2" x="180.0" y="145" text-anchor="middle">→</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">調べ方の案内</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">なし</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">重要なページなら</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">URL検査で原因を調べる</text><text class="f-s2" x="180.0" y="203" text-anchor="middle">→</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">報告先の案内</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">なし</text><text class="f-t2" x="269.0" y="252" text-anchor="middle">サイト全体の不具合なら</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">報告フォームへ</text><text class="f-s2" x="180.0" y="261" text-anchor="middle">→</text></svg>
