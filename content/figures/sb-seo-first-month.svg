<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" role="img" aria-label="最初の1か月でやる5つ:Googleビジネスプロフィールを整える、Search Consoleに登録する、お客さんによく聞かれる質問を10個書き出す、サービスのページに地域と料金の目安と連絡方法を書く、問い合わせの数を記録する"><defs><marker id="ah-sb-seo-first-month" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">Googleビジネスプロフィールを整える</text><text class="f-s" x="60" y="52">地図に出る情報。無料。約1〜2時間</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-sb-seo-first-month)"/><rect class="f-b" x="16" y="90" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">Search Console に登録する</text><text class="f-s" x="60" y="136">サイトの通知表。無料。約30分</text><line class="f-ar" x1="180.0" y1="150" x2="180.0" y2="170" marker-end="url(#ah-sb-seo-first-month)"/><rect class="f-b" x="16" y="174" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="196" r="12"/><text class="f-numt" x="38" y="200.5" text-anchor="middle">3</text><text class="f-t" x="60" y="199">よく聞かれる質問を10個書き出す</text><text class="f-s" x="60" y="220">電話・メール・見積もりの時の質問</text><line class="f-ar" x1="180.0" y1="234" x2="180.0" y2="254" marker-end="url(#ah-sb-seo-first-month)"/><rect class="f-p" x="16" y="258" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="280" r="12"/><text class="f-numt" x="38" y="284.5" text-anchor="middle">4</text><text class="f-t" x="60" y="283">サービスのページを直す</text><text class="f-s" x="60" y="304">地域・料金の目安・事例・連絡方法</text><line class="f-ar" x1="180.0" y1="318" x2="180.0" y2="338" marker-end="url(#ah-sb-seo-first-month)"/><rect class="f-g" x="16" y="342" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="364" r="12"/><text class="f-numt" x="38" y="368.5" text-anchor="middle">5</text><text class="f-t" x="60" y="367">問い合わせの数を記録する</text><text class="f-s" x="60" y="388">「何を見て連絡しましたか?」も聞く</text></svg>
