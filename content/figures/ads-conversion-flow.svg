<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 442" role="img" aria-label="コンバージョン計測のしくみ:広告のクリック、サイトでの成果、ブラウザのタグとサーバーからの送信の2つの経路、広告媒体での重複排除、自動入札の学習の流れ"><defs><marker id="ah-ads-conversion-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">広告をクリック</text><text class="f-s" x="60" y="52">クリックの情報が付いてサイトへ</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-ads-conversion-flow)"/><rect class="f-b" x="16" y="90" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">サイトで成果</text><text class="f-s" x="60" y="136">購入・問い合わせの完了</text><line class="f-ar" x1="180.0" y1="150" x2="180.0" y2="170" marker-end="url(#ah-ads-conversion-flow)"/><rect class="f-w" x="16" y="174" width="158.0" height="74" rx="12"/><text class="f-t2" x="95.0" y="198" text-anchor="middle">ブラウザのタグ</text><text class="f-s2" x="95.0" y="218" text-anchor="middle">Googleタグ</text><text class="f-s2" x="95.0" y="236" text-anchor="middle">Metaピクセル</text><line class="f-ar" x1="95.0" y1="250" x2="95.0" y2="270" marker-end="url(#ah-ads-conversion-flow)"/><rect class="f-w" x="186.0" y="174" width="158.0" height="74" rx="12"/><text class="f-t2" x="265.0" y="198" text-anchor="middle">サーバー・入力情報</text><text class="f-s2" x="265.0" y="218" text-anchor="middle">拡張コンバージョン</text><text class="f-s2" x="265.0" y="236" text-anchor="middle">コンバージョンAPI</text><line class="f-ar" x1="265.0" y1="250" x2="265.0" y2="270" marker-end="url(#ah-ads-conversion-flow)"/><rect class="f-p" x="16" y="274" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="296" r="12"/><text class="f-numt" x="38" y="300.5" text-anchor="middle">3</text><text class="f-t" x="60" y="299">広告媒体(Google・Meta)</text><text class="f-s" x="60" y="320">同じ成果は1件にまとめる(重複排除)</text><line class="f-ar" x1="180.0" y1="334" x2="180.0" y2="354" marker-end="url(#ah-ads-conversion-flow)"/><rect class="f-g" x="16" y="358" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="380" r="12"/><text class="f-numt" x="38" y="384.5" text-anchor="middle">4</text><text class="f-t" x="60" y="383">自動入札の学習・レポート</text><text class="f-s" x="60" y="404">計測がずれると、AIは</text><text class="f-s" x="60" y="422">「ずれた成果」を増やそうとする</text></svg>
