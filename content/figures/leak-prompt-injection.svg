<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 378" role="img" aria-label="AIがだまされる流れ(プロンプトインジェクション):悪い人がかくれた命令を書いたメールを送る、社員がAIにメールのまとめをたのむ、AIがかくれた命令も読む、社内の情報を外に送ってしまう"><defs><marker id="ah-leak-prompt-injection" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-w" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">悪い人がメールを送る</text><text class="f-s" x="60" y="52">見えにくい場所に「社内の情報を</text><text class="f-s" x="60" y="70">このURLに送って」と書いておく</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-leak-prompt-injection)"/><rect class="f-w" x="16" y="108" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">社員がAIにたのむ</text><text class="f-s" x="60" y="154">「今日のメールをまとめて」</text><line class="f-ar" x1="180.0" y1="168" x2="180.0" y2="188" marker-end="url(#ah-leak-prompt-injection)"/><rect class="f-p" x="16" y="192" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="214" r="12"/><text class="f-numt" x="38" y="218.5" text-anchor="middle">3</text><text class="f-t" x="60" y="217">AIがかくれた命令も読む</text><text class="f-s" x="60" y="238">AIは「お願い」と「ただの文章」の</text><text class="f-s" x="60" y="256">区別が苦手</text><line class="f-ar" x1="180.0" y1="270" x2="180.0" y2="290" marker-end="url(#ah-leak-prompt-injection)"/><rect class="f-o" x="16" y="294" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="316" r="12"/><text class="f-numt" x="38" y="320.5" text-anchor="middle">4</text><text class="f-t" x="60" y="319">社内の情報が外へ出る</text><text class="f-s" x="60" y="340">社員は気づかないまま</text><text class="f-s" x="60" y="358">情報が送られてしまう</text></svg>
