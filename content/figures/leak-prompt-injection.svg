<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 396" role="img" aria-label="AIがだまされる流れ(プロンプトインジェクション):泥棒がニセの指示メモを入れた手紙を送る、店長がお手伝いさん(AI)に手紙の整理をたのむ、お手伝いさんはメモを店長の指示とまちがえる、名簿の写しが外へ送られる"><defs><marker id="ah-leak-prompt-injection" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-w" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">泥棒が手紙(メール)を送る</text><text class="f-s" x="60" y="52">中に小さく「名簿をこの住所に</text><text class="f-s" x="60" y="70">送ること」とメモを入れておく</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-leak-prompt-injection)"/><rect class="f-w" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">店長がお手伝いさんにたのむ</text><text class="f-s" x="60" y="154">「今日の手紙をまとめておいて」</text><text class="f-s" x="60" y="172">(社員がAIにメールの要約をたのむ)</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-leak-prompt-injection)"/><rect class="f-p" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">メモを店長の指示とまちがえる</text><text class="f-s" x="60" y="256">AIは「たのまれたこと」と「読んだ文」</text><text class="f-s" x="60" y="274">の区別が苦手</text><line class="f-ar" x1="180.0" y1="288" x2="180.0" y2="308" marker-end="url(#ah-leak-prompt-injection)"/><rect class="f-o" x="16" y="312" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="334" r="12"/><text class="f-numt" x="38" y="338.5" text-anchor="middle">4</text><text class="f-t" x="60" y="337">名簿の写しが外へ出る</text><text class="f-s" x="60" y="358">店長は気づかないまま</text><text class="f-s" x="60" y="376">情報が送られてしまう</text></svg>
