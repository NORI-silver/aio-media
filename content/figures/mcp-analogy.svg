<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 288" role="img" aria-label="MCPとUSB-Cのたとえ:パソコンはAIアプリ、USB-Cの形はMCP、さしこむ機器はMCPサーバー、機器の中のデータはSearch ConsoleやGA4のデータ"><defs><marker id="ah-mcp-analogy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">USB-Cでは</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">MCPでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="87" text-anchor="middle">パソコン</text><text class="f-t2" x="269.0" y="78" text-anchor="middle">AIアプリ</text><text class="f-s2" x="269.0" y="96" text-anchor="middle">(Claude・ChatGPTなど)</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="136" text-anchor="middle">USB-Cの形</text><text class="f-s2" x="91.0" y="154" text-anchor="middle">(どの機器もさせる)</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">MCP</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">(共通のつなぎ方)</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">さしこむ機器</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">(カメラ・メモリなど)</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">MCPサーバー</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">(道具の窓口)</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-s2" x="91.0" y="252" text-anchor="middle">機器の中の</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">写真やデータ</text><text class="f-s2" x="269.0" y="252" text-anchor="middle">Search Consoleや</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">GA4のデータ</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text></svg>
