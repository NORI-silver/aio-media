<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" role="img" aria-label="MCPがないときは、AIアプリと道具の組み合わせごとに別々のつなぎ方が必要。MCPがあると、どれも同じ差し込み口でつながる"><defs><marker id="ah-mcp-before-after" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><text class="f-l" x="16" y="18">MCPがないとき:組み合わせの数だけ作る</text><rect class="f-b" x="16.0" y="28" width="104.0" height="36" rx="12"/><text class="f-s2" x="68.0" y="51" text-anchor="middle">AIアプリA</text><rect class="f-b" x="128.0" y="28" width="104.0" height="36" rx="12"/><text class="f-s2" x="180.0" y="51" text-anchor="middle">AIアプリB</text><rect class="f-b" x="240.0" y="28" width="104.0" height="36" rx="12"/><text class="f-s2" x="292.0" y="51" text-anchor="middle">AIアプリC</text><line class="f-ar" x1="68.0" y1="66" x2="68.0" y2="128"/><line class="f-ar" x1="68.0" y1="66" x2="180.0" y2="128"/><line class="f-ar" x1="68.0" y1="66" x2="292.0" y2="128"/><line class="f-ar" x1="180.0" y1="66" x2="68.0" y2="128"/><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="128"/><line class="f-ar" x1="180.0" y1="66" x2="292.0" y2="128"/><line class="f-ar" x1="292.0" y1="66" x2="68.0" y2="128"/><line class="f-ar" x1="292.0" y1="66" x2="180.0" y2="128"/><line class="f-ar" x1="292.0" y1="66" x2="292.0" y2="128"/><rect class="f-o" x="16.0" y="130" width="104.0" height="36" rx="12"/><text class="f-s2" x="68.0" y="153" text-anchor="middle">道具1</text><rect class="f-o" x="128.0" y="130" width="104.0" height="36" rx="12"/><text class="f-s2" x="180.0" y="153" text-anchor="middle">道具2</text><rect class="f-o" x="240.0" y="130" width="104.0" height="36" rx="12"/><text class="f-s2" x="292.0" y="153" text-anchor="middle">道具3</text><text class="f-s" x="16" y="192">→ 3×3=9通りのつなぎ方が必要</text><text class="f-l" x="16" y="232">MCPがあるとき:同じ差し込み口でつながる</text><rect class="f-b" x="16.0" y="242" width="104.0" height="36" rx="12"/><text class="f-s2" x="68.0" y="265" text-anchor="midd