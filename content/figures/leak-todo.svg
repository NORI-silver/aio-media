<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 492" role="img" aria-label="今日からできる6つの対策をお店にたとえると:鍵に合言葉を足す(2段階ログイン)、合鍵を持つ人の一覧を見直す(管理者)、業者に渡した合鍵を回収する(連携)、名簿を見せていい相手を決める(AIのルール)、古い名簿をシュレッダーにかける(不要なデータを消す)、店長からの電話でもかけ直す(別の方法で確認)"><defs><marker id="ah-leak-todo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-g" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">鍵に合言葉を足す</text><text class="f-s" x="60" y="52">2段階のログインをオンにする</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="90" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">合鍵を持つ人の一覧を見直す</text><text class="f-s" x="60" y="136">やめた人・知らない人を管理者から外す</text><line class="f-ar" x1="180.0" y1="150" x2="180.0" y2="170" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="174" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="196" r="12"/><text class="f-numt" x="38" y="200.5" text-anchor="middle">3</text><text class="f-t" x="60" y="199">業者に渡した合鍵を回収する</text><text class="f-s" x="60" y="220">使っていないサービスの連携を外す</text><line class="f-ar" x1="180.0" y1="234" x2="180.0" y2="254" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="258" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="280" r="12"/><text class="f-numt" x="38" y="284.5" text-anchor="middle">4</text><text class="f-t" x="60" y="283">名簿を見せていい相手を決める</text><text class="f-s" x="60" y="304">AIに入れていい情報のルールを作る</text><line class="f-ar" x1="180.0" y1="318" x2="180.0" y2="338" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="342" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="364" r="12"/><text class="f-numt" x="38" y="368.5" text-anchor="middle">5</text><text class="f-t" x="60" y="367">古い名簿をシュレッダーにかける</text><text class="f-s" x="60" y="388">使わなくなった情報を消す</text><line class="f-ar" x1="180.0" y1="402" x2="180.0" y2="422" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="426" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="448" r="12"/><text class="f-numt" x="38" y="452.5" text-anchor="middle">6</text><text class="f-t" x="60" y="451">店長からの電話でもかけ直す</text><text class="f-s" x="60" y="472">お金と権限の依頼は別の方法で確かめる</text></svg>
