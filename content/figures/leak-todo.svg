<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 546" role="img" aria-label="マーケ担当と小さな会社が今日からできる6つの対策:2段階のログインをオンにする、管理者を見直す、つないだサービスを見直す、AIに入れていい情報を決める、いらない名簿を消す、お金と権限の依頼は別の方法で確かめる"><defs><marker id="ah-leak-todo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-g" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">2段階のログインをオンにする</text><text class="f-s" x="60" y="52">広告・SNS・メール配信・顧客管理</text><text class="f-s" x="60" y="70">すべてのアカウントで</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">管理者を見直す</text><text class="f-s" x="60" y="154">知らない人・やめた人が</text><text class="f-s" x="60" y="172">管理者に残っていないか</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="210" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">つないだサービスを見直す</text><text class="f-s" x="60" y="256">使っていない連携(合鍵)は外す</text><line class="f-ar" x1="180.0" y1="270" x2="180.0" y2="290" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="294" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="316" r="12"/><text class="f-numt" x="38" y="320.5" text-anchor="middle">4</text><text class="f-t" x="60" y="319">AIに入れていい情報を決める</text><text class="f-s" x="60" y="340">名簿・パスワード・社外秘は入れない</text><line class="f-ar" x1="180.0" y1="354" x2="180.0" y2="374" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="378" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="400" r="12"/><text class="f-numt" x="38" y="404.5" text-anchor="middle">5</text><text class="f-t" x="60" y="403">いらない名簿を消す</text><text class="f-s" x="60" y="424">持っていない情報は漏れない</text><line class="f-ar" x1="180.0" y1="438" x2="180.0" y2="458" marker-end="url(#ah-leak-todo)"/><rect class="f-g" x="16" y="462" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="484" r="12"/><text class="f-numt" x="38" y="488.5" text-anchor="middle">6</text><text class="f-t" x="60" y="487">お金と権限の依頼は確かめる</text><text class="f-s" x="60" y="508">ビデオ会議でも、別の連絡方法で</text><text class="f-s" x="60" y="526">本人にもう一度確認する</text></svg>
