<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 396" role="img" aria-label="泥棒(攻撃者)がお店に入る4つの入り口:鍵の型を取る(ニセのログイン画面)、留め具のこわれた窓(直していない穴)、開いたままの店員用の裏口(管理画面やAPI)、名簿を預けた貸し倉庫(外のサービス)"><defs><marker id="ah-leak-entry-routes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">鍵の型を取る</text><text class="f-s" x="60" y="52">ニセのログイン画面で</text><text class="f-s" x="60" y="70">IDとパスワードを入れさせる</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-leak-entry-routes)"/><rect class="f-o" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">留め具のこわれた窓</text><text class="f-s" x="60" y="154">ソフトの穴(脆弱性)を</text><text class="f-s" x="60" y="172">直さずに放っておく</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-leak-entry-routes)"/><rect class="f-o" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">開いたままの店員用の裏口</text><text class="f-s" x="60" y="256">社員用の管理画面やアプリの裏側が</text><text class="f-s" x="60" y="274">外から入れる状態になっている</text><line class="f-ar" x1="180.0" y1="288" x2="180.0" y2="308" marker-end="url(#ah-leak-entry-routes)"/><rect class="f-o" x="16" y="312" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="334" r="12"/><text class="f-numt" x="38" y="338.5" text-anchor="middle">4</text><text class="f-t" x="60" y="337">名簿を預けた貸し倉庫</text><text class="f-s" x="60" y="358">メール配信や顧客管理など</text><text class="f-s" x="60" y="376">外のサービスが先に破られる</text></svg>
