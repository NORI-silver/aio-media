<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="Google検索の仕組み:URLの発見、クロール、レンダリング、インデックス登録、検索結果の表示の順に進む流れ図"><defs><marker id="ah-google-search-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><text class="f-t" x="30" y="31">URLを見つける</text><text class="f-s" x="30" y="52">リンクをたどる・サイトマップを読む</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-google-search-flow)"/><rect class="f-b" x="16" y="90" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">1</text><text class="f-t" x="60" y="115">クロール</text><text class="f-s" x="60" y="136">Googlebot がページを取得</text><text class="f-s" x="60" y="154">robots.txt で許可されたページだけ</text><line class="f-ar" x1="180.0" y1="168" x2="180.0" y2="188" marker-end="url(#ah-google-search-flow)"/><rect class="f-b" x="16" y="192" width="328" height="76" rx="12"/><text class="f-t" x="30" y="217">レンダリング</text><text class="f-s" x="30" y="238">JavaScript を実行して</text><text class="f-s" x="30" y="256">ブラウザと同じ表示を作る</text><line class="f-ar" x1="180.0" y1="270" x2="180.0" y2="290" marker-end="url(#ah-google-search-flow)"/><rect class="f-p" x="16" y="294" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="316" r="12"/><text class="f-numt" x="38" y="320.5" text-anchor="middle">2</text><text class="f-t" x="60" y="319">インデックス</text><text class="f-s" x="60" y="340">中身を理解し、似たページから</text><text class="f-s" x="60" y="358">代表(正規URL)を選んで登録</text><line class="f-ar" x1="180.0" y1="372" x2="180.0" y2="392" marker-end="url(#ah-google-search-flow)"/><rect class="f-g" x="16" y="396" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="418" r="12"/><text class="f-numt" x="38" y="422.5" text-anchor="middle">3</text><text class="f-t" x="60" y="421">検索結果の表示</text><text class="f-s" x="60" y="442">検索語・場所・言語・端末など</text><text class="f-s" x="60" y="460">数百の要因で並べる</text></svg>
