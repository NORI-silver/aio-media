<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" role="img" aria-label="Google検索の3ステップ:ページを見に行く(クロール)、中身を読んでメモする(インデックス)、役立つ順に並べる(検索結果)"><defs><marker id="ah-google-search-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">ページを見に行く(クロール)</text><text class="f-s" x="60" y="52">リンクをたどって、新しいページを</text><text class="f-s" x="60" y="70">見つけては読みに行く</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-google-search-flow)"/><rect class="f-p" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">中身を読んでメモする(インデックス)</text><text class="f-s" x="60" y="154">「このページは何の話か」を</text><text class="f-s" x="60" y="172">大きなメモ帳に書いて整理する</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-google-search-flow)"/><rect class="f-g" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">役立つ順に並べる(検索結果)</text><text class="f-s" x="60" y="256">質問されたら、メモ帳から合うページを</text><text class="f-s" x="60" y="274">さがして、役立ちそうな順に見せる</text></svg>
