<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" role="img" aria-label="2026年9月のスパムアップデートの流れ:9月24日(米国時間)に開始、最長2週間の予定、10月8日に完了。影響を見るときは9月24日より前と10月8日より後をくらべる"><defs><marker id="ah-spam-update-timeline" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="60" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">9月24日(米国時間)開始</text><text class="f-s" x="60" y="52">日本では9月25日の深夜1時すぎ</text><line class="f-ar" x1="180.0" y1="68" x2="180.0" y2="86" marker-end="url(#ah-spam-update-timeline)"/><rect class="f-w" x="16" y="90" width="328" height="60" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">2週間ほどかけて順番に反映</text><text class="f-s" x="60" y="136">この間は順位がゆれやすい</text><line class="f-ar" x1="180.0" y1="152" x2="180.0" y2="170" marker-end="url(#ah-spam-update-timeline)"/><rect class="f-g" x="16" y="174" width="328" height="60" rx="12"/><circle class="f-num" cx="38" cy="196" r="12"/><text class="f-numt" x="38" y="200.5" text-anchor="middle">3</text><text class="f-t" x="60" y="199">10月8日(米国時間)完了</text><text class="f-s" x="60" y="220">Google の検索ステータスで発表</text><rect class="f-b" x="16" y="250" width="328" height="60" rx="12"/><text class="f-t" x="30" y="275">影響を見るときは</text><text class="f-s" x="30" y="296">「9月24日より前」と「10月8日より後」をくらべる</text></svg>
