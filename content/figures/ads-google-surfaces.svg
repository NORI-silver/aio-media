<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330" role="img" aria-label="Google広告が出る場所:Google検索、YouTube、Gmail、Discover、提携サイトとアプリ、Googleマップ、ショッピング"><defs><marker id="ah-ads-google-surfaces" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16.0" y="6" width="159.0" height="76" rx="12"/><text class="f-t2" x="28.0" y="30">Google検索</text><text class="f-s2" x="28.0" y="52">検索結果の上と下</text><text class="f-l" x="28.0" y="71">→ 検索・P-MAX</text><rect class="f-o" x="185.0" y="6" width="159.0" height="76" rx="12"/><text class="f-t2" x="197.0" y="30">YouTube</text><text class="f-s2" x="197.0" y="52">動画の前後・途中など</text><text class="f-l" x="197.0" y="71">→ 動画・P-MAX など</text><rect class="f-o" x="16.0" y="92" width="159.0" height="76" rx="12"/><text class="f-t2" x="28.0" y="116">Gmail</text><text class="f-s2" x="28.0" y="138">受信トレイのタブ上部</text><text class="f-l" x="28.0" y="157">→ デマンドジェネ など</text><rect class="f-o" x="185.0" y="92" width="159.0" height="76" rx="12"/><text class="f-t2" x="197.0" y="116">Discover</text><text class="f-s2" x="197.0" y="138">Googleアプリ内</text><text class="f-l" x="197.0" y="157">→ デマンドジェネ など</text><rect class="f-o" x="16.0" y="178" width="159.0" height="76" rx="12"/><text class="f-t2" x="28.0" y="202">提携サイト・アプリ</text><text class="f-s2" x="28.0" y="224">ブログやニュースの枠</text><text class="f-l" x="28.0" y="243">→ ディスプレイ など</text><rect class="f-o" x="185.0" y="178" width="159.0" height="76" rx="12"/><text class="f-t2" x="197.0" y="202">Googleマップ</text><text class="f-s2" x="197.0" y="224">お店を探している人に</text><text class="f-l" x="197.0" y="243">→ P-MAX など</text><rect class="f-b" x="16" y="264" width="328" height="58" rx="12"/><text class="f-t" x="30" y="289">どれも1つの広告アカウントから</text><text class="f-s" x="30" y="310">キャンペーンの種類で出る場所が決まる</text></svg>
