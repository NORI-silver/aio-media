<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 230" role="img" aria-label="一次情報と二次情報のちがいを、お店の感想にたとえると:一次情報は自分で行って食べた感想、二次情報は口コミをまとめたもの"><defs><marker id="ah-first-vs-second" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-g" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">一次情報</text><rect class="f-w" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">二次情報</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="78" text-anchor="middle">自分で行って</text><text class="f-s2" x="91.0" y="96" text-anchor="middle">食べた感想</text><text class="f-t2" x="269.0" y="78" text-anchor="middle">口コミを</text><text class="f-s2" x="269.0" y="96" text-anchor="middle">まとめたもの</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="136" text-anchor="middle">自分で試した</text><text class="f-s2" x="91.0" y="154" text-anchor="middle">結果・数字</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">ほかのサイトの</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">説明の言いかえ</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">ここにしか</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">ない</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">どこにでも</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">ある</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text></svg>
