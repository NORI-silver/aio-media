<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 368" role="img" aria-label="Google検索の画面で、AI Overviews(AIによる概要)は検索結果のリンクの上に出て、AIの答えと出典のリンクを表示する"><defs><marker id="ah-ai-overviews-screen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-w" x="16" y="6" width="328" height="40" rx="12"/><text class="f-s" x="32" y="31">AIO対策 何から始める</text><rect class="f-p" x="16" y="58" width="328" height="150" rx="12"/><text class="f-t2" x="30" y="82">AIによる概要(AI Overviews)</text><rect class="f-w" x="30" y="94" width="290" height="8" rx="4"/><rect class="f-w" x="30" y="110" width="270" height="8" rx="4"/><rect class="f-w" x="30" y="126" width="280" height="8" rx="4"/><rect class="f-w" x="30" y="142" width="180" height="8" rx="4"/><rect class="f-g" x="30.0" y="164" width="146.0" height="30" rx="15"/><text class="f-s2" x="103.0" y="184" text-anchor="middle">出典のリンク</text><rect class="f-g" x="184.0" y="164" width="146.0" height="30" rx="15"/><text class="f-s2" x="257.0" y="184" text-anchor="middle">出典のリンク</text><text class="f-l" x="16" y="232">▼ その下に、いつもの検索結果</text><rect class="f-w" x="16" y="242" width="328" height="34" rx="12"/><text class="f-s2" x="30" y="264">1位のページ</text><rect class="f-w" x="16" y="284" width="328" height="34" rx="12"/><text class="f-s2" x="30" y="306">2位のページ</text><rect class="f-w" x="16" y="326" width="328" height="34" rx="12"/><text class="f-s2" x="30" y="348">3位のページ</text></svg>
