<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 402" role="img" aria-label="広告ランクの決まり方:入札単価、広告とページの品質、広告ランクの下限値、検索した状況、広告アセットの効果などから検索のたびに計算され、掲載するか、何番目か、クリック単価が決まる"><defs><marker id="ah-ads-ad-rank" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16.0" y="6" width="159.0" height="52" rx="12"/><text class="f-t2" x="28.0" y="28">入札単価</text><text class="f-s2" x="28.0" y="47">1クリックの上限</text><rect class="f-b" x="185.0" y="6" width="159.0" height="52" rx="12"/><text class="f-t2" x="197.0" y="28">広告とページの品質</text><text class="f-s2" x="197.0" y="47">役に立つか</text><rect class="f-b" x="16.0" y="66" width="159.0" height="52" rx="12"/><text class="f-t2" x="28.0" y="88">広告ランクの下限値</text><text class="f-s2" x="28.0" y="107">最低ライン</text><rect class="f-b" x="185.0" y="66" width="159.0" height="52" rx="12"/><text class="f-t2" x="197.0" y="88">競合との差</text><text class="f-s2" x="197.0" y="107">オークション</text><rect class="f-b" x="16.0" y="126" width="159.0" height="52" rx="12"/><text class="f-t2" x="28.0" y="148">検索した状況</text><text class="f-s2" x="28.0" y="167">語句・場所・端末</text><rect class="f-b" x="185.0" y="126" width="159.0" height="52" rx="12"/><text class="f-t2" x="197.0" y="148">広告アセット</text><text class="f-s2" x="197.0" y="167">電話番号など</text><line class="f-ar" x1="180.0" y1="188" x2="180.0" y2="210" marker-end="url(#ah-ads-ad-rank)"/><rect class="f-p" x="16" y="214" width="328" height="58" rx="12"/><text class="f-t" x="30" y="239">広告ランク</text><text class="f-s" x="30" y="260">検索のたびに計算し直される</text><line class="f-ar" x1="180.0" y1="274" x2="180.0" y2="296" marker-end="url(#ah-ads-ad-rank)"/><rect class="f-g" x="16" y="300" width="328" height="94" rx="12"/><text class="f-t" x="30" y="325">決まること</text><text class="f-s" x="30" y="346">① 広告を出すか</text><text class="f-s" x="30" y="364">② 何番目に出すか</text><text class="f-s" x="30" y="382">③ 実際のクリック単価</text></svg>
