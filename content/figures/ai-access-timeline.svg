<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" role="img" aria-label="AI検索で1つの質問をしたときにサイトに起きるアクセスの流れ:事前のクロール、質問時の取得、回答のリンクから人が来る"><defs><marker id="ah-ai-access-timeline" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">前もって:AIクローラーが巡回</text><text class="f-s" x="60" y="52">ページを集めて検索用の索引を作る</text><text class="f-s" x="60" y="70">(この時点では人はまだ来ない)</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-ai-access-timeline)"/><rect class="f-p" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">質問された時:AIがページを取得</text><text class="f-s" x="60" y="154">索引から選ぶ・その場で読みに来る</text><text class="f-s" x="60" y="172">読んだ内容で答えを作る</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-ai-access-timeline)"/><rect class="f-b" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">回答を読んだ人が出典をクリック</text><text class="f-s" x="60" y="256">ここで初めて人がサイトに来る</text><text class="f-s" x="60" y="274">クリックされるのは読まれた回数のごく一部</text></svg>
