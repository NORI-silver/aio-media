<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 238" role="img" aria-label="AIO・LLMO・GEO・AEOの4つの呼び方は、どれも「AIの答えの中で自分のサイトを紹介してもらう」という同じゴールを指している"><defs><marker id="ah-aio-names" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16.0" y="6" width="160.0" height="60" rx="12"/><text class="f-t" x="96.0" y="33" text-anchor="middle">AIO</text><text class="f-s2" x="96.0" y="53" text-anchor="middle">AI最適化(日本でよく使う)</text><rect class="f-b" x="184.0" y="6" width="160.0" height="60" rx="12"/><text class="f-t" x="264.0" y="33" text-anchor="middle">LLMO</text><text class="f-s2" x="264.0" y="53" text-anchor="middle">AIのもとの頭脳むけ</text><rect class="f-b" x="16.0" y="76" width="160.0" height="60" rx="12"/><text class="f-t" x="96.0" y="103" text-anchor="middle">GEO</text><text class="f-s2" x="96.0" y="123" text-anchor="middle">研究から生まれた言葉</text><rect class="f-b" x="184.0" y="76" width="160.0" height="60" rx="12"/><text class="f-t" x="264.0" y="103" text-anchor="middle">AEO</text><text class="f-s2" x="264.0" y="123" text-anchor="middle">答えを返す検索むけ</text><path class="f-ar" d="M96.0 138 L180.0 168" fill="none" marker-end="url(#ah-aio-names)"/><path class="f-ar" d="M264.0 138 L180.0 168" fill="none" marker-end="url(#ah-aio-names)"/><rect class="f-g" x="16" y="172" width="328" height="58" rx="12"/><text class="f-t" x="30" y="197">ゴールはどれも同じ</text><text class="f-s" x="30" y="218">AIの答えの中で、自分のサイトを紹介してもらう</text></svg>
