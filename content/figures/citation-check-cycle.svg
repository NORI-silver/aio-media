<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 294" role="img" aria-label="AIに紹介されているかを確かめる4ステップ:質問を決める、AIに聞く、表に記録する、ページを直す。月に1回くりかえす"><defs><marker id="ah-citation-check-cycle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">質問を決める</text><text class="f-s" x="60" y="52">お客さんがAIに聞きそうな質問を10〜20個</text><rect class="f-b" x="16" y="74" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="96" r="12"/><text class="f-numt" x="38" y="100.5" text-anchor="middle">2</text><text class="f-t" x="60" y="99">AIに聞く</text><text class="f-s" x="60" y="120">ChatGPT・Perplexity・Google で聞いてみる</text><rect class="f-p" x="16" y="142" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="164" r="12"/><text class="f-numt" x="38" y="168.5" text-anchor="middle">3</text><text class="f-t" x="60" y="167">表に記録する</text><text class="f-s" x="60" y="188">自分のサイトが紹介されたか・だれが出たか</text><rect class="f-g" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">4</text><text class="f-t" x="60" y="235">ページを直す</text><text class="f-s" x="60" y="256">紹介されなかった質問の答えを書き足す</text><text class="f-s" x="60" y="274">→ 翌月、同じ質問でもう一度</text></svg>
