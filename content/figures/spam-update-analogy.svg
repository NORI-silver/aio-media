<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" role="img" aria-label="スパムアップデートを図書館にたとえた対応表:図書館の本はWebページ、図書館のルールはGoogleのスパムに関するポリシー、ルール違反の本を見つける係はSpamBrainなどの自動の仕組み、一斉点検はスパムアップデート、棚から外されるのは順位が下がる・検索に出なくなること"><defs><marker id="ah-spam-update-analogy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">図書館では</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">Googleでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="87" text-anchor="middle">棚に並ぶ本</text><text class="f-t2" x="269.0" y="87" text-anchor="middle">Webページ</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="145" text-anchor="middle">図書館のルール</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">スパムのポリシー</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">(17項目)</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="203" text-anchor="middle">違反の本を見つける係</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">自動の仕組み</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">(SpamBrain など)</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">係の見る目を</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">きたえ直す</text><text class="f-t2" x="269.0" y="261" text-anchor="middle">スパムアップデート</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text><rect class="f-w" x="16" y="288" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="288" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="310" text-anchor="middle">棚から外す・</text><text class="f-s2" x="91.0" y="328" text-anchor="middle">奥にしまう</text><text class="f-t2" x="269.0" y="310" text-anchor="middle">順位が下がる・</text><text class="f-s2" x="269.0" y="328" text-anchor="middle">検索に出なくなる</text><text class="f-t" x="180.0" y="319" text-anchor="middle">=</text></svg>
