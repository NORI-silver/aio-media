<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" role="img" aria-label="ChatGPT検索に出るためにやる5つ:OAI-SearchBotを止めない、出したくないページはnoindex、ふつうの検索で見つかる状態にする、冒頭で答え自分だけの情報を書く、utm_source=chatgpt.comで流入を確かめる"><defs><marker id="ah-chatgpt-search-todo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><text class="f-t" x="30" y="31">OAI-SearchBot を止めない</text><text class="f-s" x="30" y="52">/robots.txt を開いて確かめる</text><rect class="f-o" x="16" y="70" width="328" height="76" rx="12"/><text class="f-t" x="30" y="95">出したくないページは noindex</text><text class="f-s" x="30" y="116">robots.txt で止めるだけでは</text><text class="f-s" x="30" y="134">題名とURLが出ることがある</text><rect class="f-b" x="16" y="152" width="328" height="58" rx="12"/><text class="f-t" x="30" y="177">ふつうの検索で見つかる状態に</text><text class="f-s" x="30" y="198">外部の検索サービスも使われるため</text><rect class="f-p" x="16" y="216" width="328" height="58" rx="12"/><text class="f-t" x="30" y="241">冒頭で答え、自分だけの情報を書く</text><text class="f-s" x="30" y="262">地域・料金・試した結果など</text><rect class="f-g" x="16" y="280" width="328" height="58" rx="12"/><text class="f-t" x="30" y="305">流入を確かめる</text><text class="f-s" x="30" y="326">GA4 で chatgpt.com からの訪問</text></svg>
