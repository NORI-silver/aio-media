<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 336" role="img" aria-label="攻撃者に狙われるもの:IDとパスワードなどの鍵、お客さんの名簿、広告やSNSのアカウント、外のサービスとの連携、本人確認書類の画像"><defs><marker id="ah-leak-targets" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><text class="f-t" x="30" y="31">ID・パスワード・合鍵</text><text class="f-s" x="30" y="52">いちばん狙われる。鍵があれば何でも開く</text><rect class="f-o" x="16" y="72" width="328" height="58" rx="12"/><text class="f-t" x="30" y="97">お客さんの名簿</text><text class="f-s" x="30" y="118">メールアドレス・住所・電話番号</text><rect class="f-p" x="16" y="138" width="328" height="58" rx="12"/><text class="f-t" x="30" y="163">広告・SNSのアカウント</text><text class="f-s" x="30" y="184">乗っ取られると広告費を使われる</text><rect class="f-p" x="16" y="204" width="328" height="58" rx="12"/><text class="f-t" x="30" y="229">外のサービスとの連携</text><text class="f-s" x="30" y="250">メール配信・顧客管理・分析ツール</text><rect class="f-b" x="16" y="270" width="328" height="58" rx="12"/><text class="f-t" x="30" y="295">本人確認書類の画像</text><text class="f-s" x="30" y="316">運転免許証など(2026年に漏えいが続いた)</text></svg>
