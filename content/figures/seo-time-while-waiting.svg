<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 344" role="img" aria-label="待つあいだにやる5つ:Search Consoleに登録してサイトマップを送る、ページ同士をリンクでつなぐ、細かい質問に答える記事から書く、冒頭で答える、急ぐ集客は広告で補う"><defs><marker id="ah-seo-time-while-waiting" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">Search Console に登録する</text><text class="f-s" x="60" y="52">サイトマップを送り、登録の進みを見る</text><rect class="f-b" x="16" y="74" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="96" r="12"/><text class="f-numt" x="38" y="100.5" text-anchor="middle">2</text><text class="f-t" x="60" y="99">ページ同士をリンクでつなぐ</text><text class="f-s" x="60" y="120">新しいページへの道をつくる</text><rect class="f-p" x="16" y="142" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="164" r="12"/><text class="f-numt" x="38" y="168.5" text-anchor="middle">3</text><text class="f-t" x="60" y="167">細かい質問の記事から書く</text><text class="f-s" x="60" y="188">ライバルが少なく、早く読まれやすい</text><rect class="f-p" x="16" y="210" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">4</text><text class="f-t" x="60" y="235">最初の1〜2文で答える</text><text class="f-s" x="60" y="256">検索にもAIにも使われやすい形に</text><rect class="f-g" x="16" y="278" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="300" r="12"/><text class="f-numt" x="38" y="304.5" text-anchor="middle">5</text><text class="f-t" x="60" y="303">急ぎの集客は広告で補う</text><text class="f-s" x="60" y="324">広告はお金を払えばその日から出る</text></svg>
