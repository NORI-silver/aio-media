<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 372" role="img" aria-label="自動入札のしくみ:検索のたびに、デバイスや場所、時間帯、検索語句、過去の訪問などの手がかりから成果につながる見込みを予測し、見込みが高ければ高く、低ければ低く入札する"><defs><marker id="ah-ads-smart-bidding" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-w" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">だれかが検索した!</text><text class="f-s" x="60" y="52">「渋谷 整体 予約」 21:30 スマホ</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-ads-smart-bidding)"/><rect class="f-b" x="16" y="90" width="328" height="106" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">手がかり(シグナル)を見る</text><rect class="f-w" x="28.0" y="128" width="97.33333333333333" height="26" rx="8"/><text class="f-s2" x="76.66666666666666" y="146" text-anchor="middle">デバイス</text><rect class="f-w" x="131.33333333333331" y="128" width="97.33333333333333" height="26" rx="8"/><text class="f-s2" x="179.99999999999997" y="146" text-anchor="middle">場所</text><rect class="f-w" x="234.66666666666666" y="128" width="97.33333333333333" height="26" rx="8"/><text class="f-s2" x="283.3333333333333" y="146" text-anchor="middle">時間帯</text><rect class="f-w" x="28.0" y="160" width="97.33333333333333" height="26" rx="8"/><text class="f-s2" x="76.66666666666666" y="178" text-anchor="middle">検索語句</text><rect class="f-w" x="131.33333333333331" y="160" width="97.33333333333333" height="26" rx="8"/><text class="f-s2" x="179.99999999999997" y="178" text-anchor="middle">過去の訪問</text><rect class="f-w" x="234.66666666666666" y="160" width="97.33333333333333" height="26" rx="8"/><text class="f-s2" x="283.3333333333333" y="178" text-anchor="middle">言語・OS</text><line class="f-ar" x1="180.0" y1="198" x2="180.0" y2="218" marker-end="url(#ah-ads-smart-bidding)"/><rect class="f-p" x="16" y="222" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="244" r="12"/><text class="f-numt" x="38" y="248.5" text-anchor="middle">3</text><text class="f-t" x="60" y="247">成果につながる見込みを予測</text><text class="f-s" x="60" y="268">過去の成果のデータから学習したAI</text><line class="f-ar" x1="110.0" y1="282" x2="110.0" y2="302" marker-end="url(#ah-ads-smart-bidding)"/><line class="f-ar" x1="250.0" y1="282" x2="250.0" y2="302" marker-end="url(#ah-ads-smart-bidding)"/><rect class="f-g" x="16" y="306" width="159.0" height="58" rx="12"/><text class="f-t2" x="95.5" y="330" text-anchor="middle">見込みが高い</text><text class="f-s2" x="95.5" y="350" text-anchor="middle">→ 高く入札</text><rect class="f-o" x="185.0" y="306" width="159.0" height="58" rx="12"/><text class="f-t2" x="264.5" y="330" text-anchor="middle">見込みが低い</text><text class="f-s2" x="264.5" y="350" text-anchor="middle">→ 低く・出さない</text></svg>
