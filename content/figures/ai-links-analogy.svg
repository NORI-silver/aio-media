<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" role="img" aria-label="AIの答えのリンクが増えることを図書館の司書さんにたとえた対応表:司書さんの説明はAIの答え、話しながら本を指さすのは文中のリンク、受付窓口の案内は公式サイトの欄、新聞の棚はニュースのカルーセル、関連本の表紙は画像つきのリンク"><defs><marker id="ah-ai-links-analogy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">図書館では</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">Googleでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="87" text-anchor="middle">司書さんの説明</text><text class="f-t2" x="269.0" y="78" text-anchor="middle">AIの答え</text><text class="f-s2" x="269.0" y="96" text-anchor="middle">(AI Overviews・AIモード)</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="136" text-anchor="middle">話しながら</text><text class="f-s2" x="91.0" y="154" text-anchor="middle">本を指さす</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">文中のリンク</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">(インラインリンク)</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">「窓口はあちら」</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">と先に案内</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">公式サイトの欄</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">(テスト中)</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="261" text-anchor="middle">今日の新聞の棚</text><text class="f-t2" x="269.0" y="261" text-anchor="middle">ニュースのカルーセル</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text><rect class="f-w" x="16" y="288" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="288" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="310" text-anchor="middle">関連本を表紙つきで</text><text class="f-s2" x="91.0" y="328" text-anchor="middle">見せる</text><text class="f-t2" x="269.0" y="310" text-anchor="middle">答えの最後のリンクに</text><text class="f-s2" x="269.0" y="328" text-anchor="middle">画像がつく</text><text class="f-t" x="180.0" y="319" text-anchor="middle">=</text></svg>
