<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" role="img" aria-label="広告の成果が出ないときに確かめる順番:計測、成果の選び方、構成と予算、判断のしかた、広告とページの順"><defs><marker id="ah-ads-check-order" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">成果は正しく計測されている?</text><text class="f-s" x="60" y="52">タグが外れていないか・二重に数えていないか</text><line class="f-ar" x1="180.0" y1="66" x2="180.0" y2="86" marker-end="url(#ah-ads-check-order)"/><rect class="f-o" x="16" y="90" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="112" r="12"/><text class="f-numt" x="38" y="116.5" text-anchor="middle">2</text><text class="f-t" x="60" y="115">AIに正しい成果を学ばせている?</text><text class="f-s" x="60" y="136">ページの閲覧などをメインにしていないか</text><line class="f-ar" x1="180.0" y1="150" x2="180.0" y2="170" marker-end="url(#ah-ads-check-order)"/><rect class="f-b" x="16" y="174" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="196" r="12"/><text class="f-numt" x="38" y="200.5" text-anchor="middle">3</text><text class="f-t" x="60" y="199">構成と予算は学習できる形?</text><text class="f-s" x="60" y="220">分けすぎ・目標が厳しすぎないか</text><line class="f-ar" x1="180.0" y1="234" x2="180.0" y2="254" marker-end="url(#ah-ads-check-order)"/><rect class="f-b" x="16" y="258" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="280" r="12"/><text class="f-numt" x="38" y="284.5" text-anchor="middle">4</text><text class="f-t" x="60" y="283">判断のしかたは正しい?</text><text class="f-s" x="60" y="304">触りすぎ・直近だけで判断していないか</text><line class="f-ar" x1="180.0" y1="318" x2="180.0" y2="338" marker-end="url(#ah-ads-check-order)"/><rect class="f-g" x="16" y="342" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="364" r="12"/><text class="f-numt" x="38" y="368.5" text-anchor="middle">5</text><text class="f-t" x="60" y="367">広告とページは合っている?</text><text class="f-s" x="60" y="388">検索語句・広告文・ページの最初の画面</text></svg>
