<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" role="img" aria-label="LLMO対策をガイドブックの取材にたとえた対応表:ガイドブックはAI検索、取材に来る記者はAIのボット、取材おことわりの張り紙はrobots.txtでボットを止めること、掲載NGの申し出はnoindexや生成AI設定の除外、看板とメニューで何の店かわかるのは冒頭で答えて見出しで整理すること、その店だけの名物は一次情報、店主の名前と連絡先は運営者情報、新しい号をめくって確かめるのはAIの答えを確かめること"><defs><marker id="ah-llmo-guidebook" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">ガイドブックでは</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">AI検索では</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="78" text-anchor="middle">ガイドブック</text><text class="f-s2" x="91.0" y="96" text-anchor="middle">(質問に答えて店を紹介)</text><text class="f-t2" x="269.0" y="78" text-anchor="middle">AI検索</text><text class="f-s2" x="269.0" y="96" text-anchor="middle">(ChatGPT・AIによる概要)</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="145" text-anchor="middle">取材に来る記者</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">AIのボット</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">(ページを読みに来る)</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">「取材おことわり」</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">の張り紙</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">robots.txt で</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">ボットを止める</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">「掲載NG」の</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">申し出</text><text class="f-t2" x="269.0" y="252" text-anchor="middle">noindex・nosnippet・</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">生成AI設定の「除外」</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text><rect class="f-w" x="16" y="288" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="288" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="310" text-anchor="middle">看板とメニューで</text><text class="f-s2" x="91.0" y="328" text-anchor="middle">何の店か一目でわかる</text><text class="f-t2" x="269.0" y="310" text-anchor="middle">冒頭で答える・</text><text class="f-s2" x="269.0" y="328" text-anchor="middle">見出しで整理する</text><text class="f-t" x="180.0" y="319" text-anchor="middle">=</text><rect class="f-w" x="16" y="346" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="346" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="377" text-anchor="middle">その店だけの名物</text><text class="f-t2" x="269.0" y="368" text-anchor="middle">自分だけの情報</text><text class="f-s2" x="269.0" y="386" text-anchor="middle">(一次情報)</text><text class="f-t" x="180.0" y="377" text-anchor="middle">=</text><rect class="f-w" x="16" y="404" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="404" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="435" text-anchor="middle">店主の名前と連絡先</text><text class="f-t2" x="269.0" y="426" text-anchor="middle">運営者・書いた人・</text><text class="f-s2" x="269.0" y="444" text-anchor="middle">更新日</text><text class="f-t" x="180.0" y="435" text-anchor="middle">=</text><rect class="f-w" x="16" y="462" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="462" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="484" text-anchor="middle">新しい号をめくって</text><text class="f-s2" x="91.0" y="502" text-anchor="middle">のっているか確かめる</text><text class="f-t2" x="269.0" y="484" text-anchor="middle">AIに質問して</text><text class="f-s2" x="269.0" y="502" text-anchor="middle">確かめる</text><text class="f-t" x="180.0" y="493" text-anchor="middle">=</text></svg>
