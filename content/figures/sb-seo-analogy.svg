<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 404" role="img" aria-label="中小企業のSEOを町の案内所にたとえた対応表:町の案内所はGoogle検索、お客さんの相談は検索、案内係が知っているお店からすすめるのはインデックスと順位、案内所に置くお店のチラシはGoogleビジネスプロフィール、店先の看板とメニューは自社のWebサイト、町の評判は口コミと他サイトからの紹介"><defs><marker id="ah-sb-seo-analogy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">町の案内所では</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">Googleでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="87" text-anchor="middle">町の案内所</text><text class="f-t2" x="269.0" y="87" text-anchor="middle">Google 検索</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="136" text-anchor="middle">「近くで◯◯して</text><text class="f-s2" x="91.0" y="154" text-anchor="middle">くれる店は?」</text><text class="f-t2" x="269.0" y="145" text-anchor="middle">検索する</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">案内係が知っている</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">店からすすめる</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">登録ずみのページを</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">順に並べる</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">案内所に置く</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">お店のチラシ</text><text class="f-t2" x="269.0" y="252" text-anchor="middle">Googleビジネス</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">プロフィール(地図)</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text><rect class="f-w" x="16" y="288" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="288" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="310" text-anchor="middle">店先の看板・</text><text class="f-s2" x="91.0" y="328" text-anchor="middle">メニュー・値段</text><text class="f-t2" x="269.0" y="319" text-anchor="middle">自社のWebサイト</text><text class="f-t" x="180.0" y="319" text-anchor="middle">=</text><rect class="f-w" x="16" y="346" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="346" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="377" text-anchor="middle">町の人の評判</text><text class="f-t2" x="269.0" y="368" text-anchor="middle">口コミ・ほかの</text><text class="f-s2" x="269.0" y="386" text-anchor="middle">サイトからの紹介</text><text class="f-t" x="180.0" y="377" text-anchor="middle">=</text></svg>
