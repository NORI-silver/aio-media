<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 318" role="img" aria-label="SEOとAIOの関係:読んでもらえる、わかってもらえる、えらばれるの3段。下の2段はSEOとAIOで同じ"><defs><marker id="ah-seo-aio-layers" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-g" x="48" y="6" width="264" height="96" rx="12"/><text class="f-t" x="62" y="31">③ えらばれる</text><text class="f-s" x="62" y="52">SEO:検索結果で上に並ぶ</text><text class="f-s" x="62" y="70">AIO:AIの答えで紹介される</text><text class="f-l" x="62" y="90">▸ 自分で試したこと・最初に答えを書く</text><rect class="f-p" x="32" y="110" width="296" height="96" rx="12"/><text class="f-t" x="46" y="135">② わかってもらえる</text><text class="f-s" x="46" y="156">見出しで「何の話か」をはっきり</text><text class="f-s" x="46" y="174">ページの説明を正しく書く</text><text class="f-l" x="46" y="194">▸ SEOとAIOで同じ</text><rect class="f-b" x="16" y="214" width="328" height="96" rx="12"/><text class="f-t" x="30" y="239">① 読んでもらえる</text><text class="f-s" x="30" y="260">見に来るのを止めない</text><text class="f-s" x="30" y="278">文字を文字として書く</text><text class="f-l" x="30" y="298">▸ SEOとAIOで同じ</text></svg>
