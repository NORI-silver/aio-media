<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 346" role="img" aria-label="SEOに時間がかかる理由を図書館にたとえた対応表:新しい本を届けるのはページの公開、司書さんが新しい本に気づくのは発見、中身を読んでカードにメモするのはクロールとインデックス、質問した人にすすめるのは検索結果の順位、ほかの本の参考文献にのるのは他サイトからのリンク"><defs><marker id="ah-seo-time-library" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="91.0" y="31" text-anchor="middle">図書館では</text><rect class="f-b" x="194.0" y="6" width="150.0" height="40" rx="12"/><text class="f-t" x="269.0" y="31" text-anchor="middle">Googleでは</text><rect class="f-w" x="16" y="56" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="56" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="78" text-anchor="middle">新しい本を</text><text class="f-s2" x="91.0" y="96" text-anchor="middle">図書館に届ける</text><text class="f-t2" x="269.0" y="87" text-anchor="middle">ページを公開する</text><text class="f-t" x="180.0" y="87" text-anchor="middle">=</text><rect class="f-w" x="16" y="114" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="114" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="136" text-anchor="middle">司書さんが</text><text class="f-s2" x="91.0" y="154" text-anchor="middle">新しい本に気づく</text><text class="f-t2" x="269.0" y="136" text-anchor="middle">ページを見つける</text><text class="f-s2" x="269.0" y="154" text-anchor="middle">(発見)</text><text class="f-t" x="180.0" y="145" text-anchor="middle">=</text><rect class="f-w" x="16" y="172" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="172" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="194" text-anchor="middle">中身を読んで</text><text class="f-s2" x="91.0" y="212" text-anchor="middle">カードにメモ</text><text class="f-t2" x="269.0" y="194" text-anchor="middle">読んで登録する</text><text class="f-s2" x="269.0" y="212" text-anchor="middle">(クロール・インデックス)</text><text class="f-t" x="180.0" y="203" text-anchor="middle">=</text><rect class="f-w" x="16" y="230" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="230" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="252" text-anchor="middle">質問した人に</text><text class="f-s2" x="91.0" y="270" text-anchor="middle">合う本をすすめる</text><text class="f-t2" x="269.0" y="252" text-anchor="middle">検索結果に並べる</text><text class="f-s2" x="269.0" y="270" text-anchor="middle">(順位)</text><text class="f-t" x="180.0" y="261" text-anchor="middle">=</text><rect class="f-w" x="16" y="288" width="150.0" height="50" rx="12"/><rect class="f-w" x="194.0" y="288" width="150.0" height="50" rx="12"/><text class="f-t2" x="91.0" y="310" text-anchor="middle">ほかの本の</text><text class="f-s2" x="91.0" y="328" text-anchor="middle">参考文献にのる</text><text class="f-t2" x="269.0" y="310" text-anchor="middle">ほかのサイトから</text><text class="f-s2" x="269.0" y="328" text-anchor="middle">リンクされる</text><text class="f-t" x="180.0" y="319" text-anchor="middle">=</text></svg>
