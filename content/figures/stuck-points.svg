<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 396" role="img" aria-label="ページが検索やAIの答えに出てこないときに止まりやすい4か所:見つけてもらえない、入れない、読めない、えらばれない"><defs><marker id="ah-stuck-points" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-w" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">見つけてもらえない</text><text class="f-s" x="60" y="52">どこからもリンクされていない</text><text class="f-s" x="60" y="70">→ 内部リンク・サイトマップ</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-stuck-points)"/><rect class="f-w" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">入れない</text><text class="f-s" x="60" y="154">robots.txt で「入らないで」にしている</text><text class="f-s" x="60" y="172">→ 設定を確かめる</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-stuck-points)"/><rect class="f-w" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">読めない</text><text class="f-s" x="60" y="256">文字が画像の中やJavaScriptの後にしかない</text><text class="f-s" x="60" y="274">→ 本文を文字でHTMLに書く</text><line class="f-ar" x1="180.0" y1="288" x2="180.0" y2="308" marker-end="url(#ah-stuck-points)"/><rect class="f-w" x="16" y="312" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="334" r="12"/><text class="f-numt" x="38" y="338.5" text-anchor="middle">4</text><text class="f-t" x="60" y="337">えらばれない</text><text class="f-s" x="60" y="358">質問にまっすぐ答えていない</text><text class="f-s" x="60" y="376">→ 最初に答えを書く・試したことを書く</text></svg>
