<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 410" role="img" aria-label="AIによる概要と広告の位置の比較(2026年11月時点):日本では広告はAIによる概要の上と下だけに出る。米国など一部の英語圏では、AIによる概要の中にも広告が出る"><defs><marker id="ah-ads-ai-overviews" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><text class="f-t2" x="95.0" y="22" text-anchor="middle">日本(日本語)</text><rect class="f-w" x="16" y="32" width="158.0" height="300" rx="12"/><rect class="f-o" x="26" y="44" width="138.0" height="40" rx="12"/><text class="f-s2" x="95.0" y="69" text-anchor="middle">広告(上)</text><rect class="f-p" x="26" y="94" width="138.0" height="168" rx="12"/><text class="f-t2" x="95.0" y="118" text-anchor="middle">AIによる概要</text><text class="f-s2" x="95.0" y="140" text-anchor="middle">AIの答え・出典</text><text class="f-s2" x="95.0" y="186" text-anchor="middle">中には広告は</text><text class="f-s2" x="95.0" y="204" text-anchor="middle">出ない</text><rect class="f-o" x="26" y="272" width="138.0" height="40" rx="12"/><text class="f-s2" x="95.0" y="297" text-anchor="middle">広告(下)</text><text class="f-t2" x="265.0" y="22" text-anchor="middle">米国など英語圏</text><rect class="f-w" x="186.0" y="32" width="158.0" height="300" rx="12"/><rect class="f-o" x="196.0" y="44" width="138.0" height="40" rx="12"/><text class="f-s2" x="265.0" y="69" text-anchor="middle">広告(上)</text><rect class="f-p" x="196.0" y="94" width="138.0" height="168" rx="12"/><text class="f-t2" x="265.0" y="118" text-anchor="middle">AIによる概要</text><text class="f-s2" x="265.0" y="140" text-anchor="middle">AIの答え・出典</text><rect class="f-o" x="208.0" y="156" width="114.0" height="40" rx="12"/><text class="f-s2" x="265.0" y="181" text-anchor="middle">広告(中)</text><text class="f-s2" x="265.0" y="232" text-anchor="middle">AIモードにも広告</text><rect class="f-o" x="196.0" y="272" width="138.0" height="40" rx="12"/><text class="f-s2" x="265.0" y="297" text-anchor="middle">広告(下)</text><rect class="f-b" x="16" y="344" width="328" height="58" rx="12"/><text class="f-t" x="30" y="369">どちらも出し分けの設定はない</text><text class="f-s" x="30" y="390">検索・P-MAXなどの広告が自動で対象</text></svg>
