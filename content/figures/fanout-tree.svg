<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 314" role="img" aria-label="AIが1つの質問を3つの小さな質問に分けて、それぞれでページをさがし、最後に1つの答えにまとめる図"><defs><marker id="ah-fanout-tree" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-b" x="16" y="6" width="328" height="52" rx="12"/><text class="f-t" x="30" y="31">大きな質問</text><text class="f-s" x="30" y="52">「AIO対策って何から始めればいい?」</text><path class="f-ar" d="M180.0 60 L68.0 92" fill="none" marker-end="url(#ah-fanout-tree)"/><rect class="f-p" x="16.0" y="96" width="104.0" height="58" rx="12"/><text class="f-s2" x="68.0" y="121" text-anchor="middle">AIOって</text><text class="f-s2" x="68.0" y="140" text-anchor="middle">なに?</text><line class="f-ar" x1="68.0" y1="156" x2="68.0" y2="178" marker-end="url(#ah-fanout-tree)"/><rect class="f-w" x="16.0" y="182" width="104.0" height="34" rx="12"/><text class="f-s2" x="68.0" y="204" text-anchor="middle">ページを読む</text><path class="f-ar" d="M68.0 218 L180.0 250" fill="none" marker-end="url(#ah-fanout-tree)"/><path class="f-ar" d="M180.0 60 L180.0 92" fill="none" marker-end="url(#ah-fanout-tree)"/><rect class="f-p" x="128.0" y="96" width="104.0" height="58" rx="12"/><text class="f-s2" x="180.0" y="121" text-anchor="middle">AIに読まれる</text><text class="f-s2" x="180.0" y="140" text-anchor="middle">設定は?</text><line class="f-ar" x1="180.0" y1="156" x2="180.0" y2="178" marker-end="url(#ah-fanout-tree)"/><rect class="f-w" x="128.0" y="182" width="104.0" height="34" rx="12"/><text class="f-s2" x="180.0" y="204" text-anchor="middle">ページを読む</text><path class="f-ar" d="M180.0 218 L180.0 250" fill="none" marker-end="url(#ah-fanout-tree)"/><path class="f-ar" d="M180.0 60 L292.0 92" fill="none" marker-end="url(#ah-fanout-tree)"/><rect class="f-p" x="240.0" y="96" width="104.0" height="58" rx="12"/><text class="f-s2" x="292.0" y="121" text-anchor="middle">えらばれる</text><text class="f-s2" x="292.0" y="140" text-anchor="middle">文章は?</text><line class="f-ar" x1="292.0" y1="156" x2="292.0" y2="178" marker-end="url(#ah-fanout-tree)"/><rect class="f-w" x="240.0" y="182" width="104.0" height="34" rx="12"/><text class="f-s2" x="292.0" y="204" text-anchor="middle">ページを読む</text><path class="f-ar" d="M292.0 218 L180.0 250" fill="none" marker-end="url(#ah-fanout-tree)"/><rect class="f-g" x="16" y="254" width="328" height="52" rx="12"/><text class="f-t" x="30" y="279">1つの答えにまとめる</text><text class="f-s" x="30" y="300">読んだページをリンクで紹介する</text></svg>
