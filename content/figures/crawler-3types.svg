<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img" aria-label="AIのボットは3種類:覚えるために集める学習用、検索の準備をする検索用、人に頼まれてその場で読みに来るもの"><defs><marker id="ah-crawler-3types" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">覚えるために集める(学習用)</text><text class="f-s" x="60" y="52">AIを作るときの勉強に使う</text><text class="f-s" x="60" y="70">例:GPTBot・ClaudeBot</text><rect class="f-g" x="16" y="92" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="114" r="12"/><text class="f-numt" x="38" y="118.5" text-anchor="middle">2</text><text class="f-t" x="60" y="117">検索の準備をする(検索用)</text><text class="f-s" x="60" y="138">AIの検索で紹介するページを集める</text><text class="f-s" x="60" y="156">例:OAI-SearchBot・PerplexityBot</text><rect class="f-p" x="16" y="178" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="200" r="12"/><text class="f-numt" x="38" y="204.5" text-anchor="middle">3</text><text class="f-t" x="60" y="203">頼まれてその場で読む</text><text class="f-s" x="60" y="224">人がAIに質問したときに読みに来る</text><text class="f-s" x="60" y="242">例:ChatGPT-User・Claude-User</text></svg>
