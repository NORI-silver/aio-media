<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img" aria-label="飲食店がやること:使っている予約サイトの空席をいつも最新にする、お店の基本情報(営業時間・料理のジャンル・場所)を正しく書く、自分の店名と条件で試して確かめる"><defs><marker id="ah-restaurant-booking-todo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-g" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">予約帳の空きを最新にする</text><text class="f-s" x="60" y="52">使っている予約サイトの空席・</text><text class="f-s" x="60" y="70">受付できる人数を正しく保つ</text><rect class="f-g" x="16" y="92" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="114" r="12"/><text class="f-numt" x="38" y="118.5" text-anchor="middle">2</text><text class="f-t" x="60" y="117">お店の基本情報を正しく</text><text class="f-s" x="60" y="138">営業時間・料理のジャンル・場所を</text><text class="f-s" x="60" y="156">予約サイトと自分のサイトでそろえる</text><rect class="f-g" x="16" y="178" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="200" r="12"/><text class="f-numt" x="38" y="204.5" text-anchor="middle">3</text><text class="f-t" x="60" y="203">自分でためしてみる</text><text class="f-s" x="60" y="224">AIモードで「地域+料理+人数+日時」と</text><text class="f-s" x="60" y="242">聞いて、自分の店が出るか見る</text></svg>
