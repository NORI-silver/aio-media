<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 328" role="img" aria-label="robots.txtはお店の入口の張り紙のようなもの。ボットごとに「どうぞ」「おことわり」を書ける。学習用だけおことわりにして、検索用はどうぞにすることもできる"><defs><marker id="ah-robots-door" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="70" rx="12"/><text class="f-t" x="30" y="31">robots.txt = 入口の張り紙</text><text class="f-s" x="30" y="52">「このボットは入ってOK/入らないで」</text><text class="f-s" x="30" y="70">とボットごとにお願いを書ける</text><text class="f-l" x="16" y="102">例:学習はおことわり、検索はどうぞ</text><rect class="f-w" x="16" y="112" width="328" height="46" rx="12"/><text class="f-t2" x="30" y="132">GPTBot</text><text class="f-s2" x="30" y="150">AIの学習用</text><rect class="f-o" x="240" y="121" width="90" height="28" rx="14"/><text class="f-t2" x="285" y="140" text-anchor="middle">おことわり</text><rect class="f-w" x="16" y="166" width="328" height="46" rx="12"/><text class="f-t2" x="30" y="186">OAI-SearchBot</text><text class="f-s2" x="30" y="204">ChatGPTの検索用</text><rect class="f-g" x="240" y="175" width="90" height="28" rx="14"/><text class="f-t2" x="285" y="194" text-anchor="middle">どうぞ</text><rect class="f-w" x="16" y="220" width="328" height="46" rx="12"/><text class="f-t2" x="30" y="240">ClaudeBot</text><text class="f-s2" x="30" y="258">AIの学習用</text><rect class="f-o" x="240" y="229" width="90" height="28" rx="14"/><text class="f-t2" x="285" y="248" text-anchor="middle">おことわり</text><rect class="f-w" x="16" y="274" width="328" height="46" rx="12"/><text class="f-t2" x="30" y="294">PerplexityBot</text><text class="f-s2" x="30" y="312">Perplexityの検索用</text><rect class="f-g" x="240" y="283" width="90" height="28" rx="14"/><text class="f-t2" x="285" y="302" text-anchor="middle">どうぞ</text></svg>
