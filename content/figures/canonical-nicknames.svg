<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 262" role="img" aria-label="canonicalのたとえ:同じページにURLがいくつもあるのは、同じ人にあだ名がいくつもあるようなもの。canonicalは名簿にのせる本名を1つ決めること"><defs><marker id="ah-canonical-nicknames" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><text class="f-l" x="16" y="20">同じページなのに、URLがいくつもある(=あだ名)</text><rect class="f-w" x="16" y="28" width="328" height="36" rx="12"/><text class="f-s2" x="30" y="51">example.com/page</text><rect class="f-w" x="16" y="70" width="328" height="36" rx="12"/><text class="f-s2" x="30" y="93">www.example.com/page</text><rect class="f-w" x="16" y="112" width="328" height="36" rx="12"/><text class="f-s2" x="30" y="135">example.com/page/?utm_source=mail</text><line class="f-ar" x1="180.0" y1="156" x2="180.0" y2="180" marker-end="url(#ah-canonical-nicknames)"/><rect class="f-g" x="16" y="184" width="328" height="70" rx="12"/><text class="f-t" x="30" y="209">代表のURL(=名簿にのせる本名)</text><text class="f-s" x="30" y="230">https://example.com/page/</text><text class="f-s" x="30" y="248">これを canonical で伝える</text></svg>
