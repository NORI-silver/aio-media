<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-label="AI Overviewsに自分のページが出ないときに確かめる順番:そもそもその検索でAI Overviewsが出ているか、Googleのメモ帳(インデックス)にのっているか、説明文やAIへの使用を止める設定がないか、Search Consoleの生成AI設定が除外になっていないか、ページがその問いに文字で答えているか"><defs><marker id="ah-ai-overviews-not-shown-check" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">その検索で AI Overviews が出ている?</text><text class="f-s" x="60" y="52">出ていなければ、だれのページも出ない</text><text class="f-s" x="60" y="70">(Google が役に立つと判断した検索だけ)</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-ai-overviews-not-shown-check)"/><rect class="f-b" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">Google のメモ帳にのっている?</text><text class="f-s" x="60" y="154">Search Console の「URL 検査」で</text><text class="f-s" x="60" y="172">「登録されています」を確かめる</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-ai-overviews-not-shown-check)"/><rect class="f-b" x="16" y="210" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">説明文を止める設定がない?</text><text class="f-s" x="60" y="256">nosnippet・max-snippet:0・</text><text class="f-s" x="60" y="274">data-nosnippet が本文にかかっていないか</text><line class="f-ar" x1="180.0" y1="288" x2="180.0" y2="308" marker-end="url(#ah-ai-overviews-not-shown-check)"/><rect class="f-p" x="16" y="312" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="334" r="12"/><text class="f-numt" x="38" y="338.5" text-anchor="middle">4</text><text class="f-t" x="60" y="337">生成 AI 設定が「除外」になっていない?</text><text class="f-s" x="60" y="358">Search Console の「設定」で確かめる</text><line class="f-ar" x1="180.0" y1="372" x2="180.0" y2="392" marker-end="url(#ah-ai-overviews-not-shown-check)"/><rect class="f-g" x="16" y="396" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="418" r="12"/><text class="f-numt" x="38" y="422.5" text-anchor="middle">5</text><text class="f-t" x="60" y="421">その問いに、文字で答えている?</text><text class="f-s" x="60" y="442">小さな問いの1つに冒頭で答える</text><text class="f-s" x="60" y="460">大事なことを画像の中だけに書かない</text></svg>
