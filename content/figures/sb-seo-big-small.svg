<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" role="img" aria-label="ばくぜんとした質問と細かい質問のくらべ:ばくぜんとした質問には有名なお店ばかりがすすめられる。地域や条件まで入った細かい質問は、当てはまるお店が少ないので小さなお店もすすめられやすい"><defs><marker id="ah-sb-seo-big-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="94" rx="12"/><text class="f-t" x="30" y="31">ばくぜんとした質問</text><text class="f-s" x="30" y="52">例:「リフォーム」「税理士」</text><text class="f-s" x="30" y="70">→ 有名な大手ばかりがすすめられる</text><text class="f-s" x="30" y="88">→ 小さな会社が勝つのはむずかしい</text><rect class="f-g" x="16" y="110" width="328" height="94" rx="12"/><text class="f-t" x="30" y="135">地域や条件まで入った細かい質問</text><text class="f-s" x="30" y="156">例:「◯◯市 浴室 リフォーム 費用」</text><text class="f-s" x="30" y="174">→ 当てはまる会社が少ない</text><text class="f-s" x="30" y="192">→ 小さな会社でもすすめられやすい</text></svg>
