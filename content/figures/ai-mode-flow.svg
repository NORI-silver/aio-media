<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 444" role="img" aria-label="AIモードが答えるまでの流れ:利用者が長い質問をする、質問を小さな問いに分けて同時に検索する、インデックスの中から合うページを集める、答えを書いてリンクをそえる、追加の質問は新しい検索として扱う"><defs><marker id="ah-ai-mode-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">利用者が長い質問をする</text><text class="f-s" x="60" y="52">例:中小企業が自分でできる</text><text class="f-s" x="60" y="70">AI検索の対策と費用の目安は?</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-ai-mode-flow)"/><rect class="f-b" x="16" y="108" width="328" height="76" rx="12"/><circle class="f-num" cx="38" cy="130" r="12"/><text class="f-numt" x="38" y="134.5" text-anchor="middle">2</text><text class="f-t" x="60" y="133">小さな問いに分けて検索</text><text class="f-s" x="60" y="154">「AI検索 対策 自分で」「費用 相場」</text><text class="f-s" x="60" y="172">など(クエリ ファンアウト)</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-ai-mode-flow)"/><rect class="f-b" x="16" y="210" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">3</text><text class="f-t" x="60" y="235">インデックスから合うページを集める</text><text class="f-s" x="60" y="256">Google に登録ずみのページだけが候補</text><line class="f-ar" x1="180.0" y1="270" x2="180.0" y2="290" marker-end="url(#ah-ai-mode-flow)"/><rect class="f-g" x="16" y="294" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="316" r="12"/><text class="f-numt" x="38" y="320.5" text-anchor="middle">4</text><text class="f-t" x="60" y="319">答えを書いてリンクをそえる</text><text class="f-s" x="60" y="340">ここで自分のページが出る=引用</text><line class="f-ar" x1="180.0" y1="354" x2="180.0" y2="374" marker-end="url(#ah-ai-mode-flow)"/><rect class="f-w" x="16" y="378" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="400" r="12"/><text class="f-numt" x="38" y="404.5" text-anchor="middle">5</text><text class="f-t" x="60" y="403">追加の質問は新しい検索</text><text class="f-s" x="60" y="424">Search Console でも別の検索語になる</text></svg>
