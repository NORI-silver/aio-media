<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 396" role="img" aria-label="攻撃者がAIを使う4つの場面:下調べを自動にする、だましの文章を作る、ニセの顔や声を作る、ウイルスを作る・変える"><defs><marker id="ah-leak-ai-attacker" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-p" x="16" y="6" width="328" height="76" rx="12"/><text class="f-t" x="30" y="31">下調べを自動にする</text><text class="f-s" x="30" y="52">穴のあるサイトを、AIが休まず</text><text class="f-s" x="30" y="70">さがし続ける</text><line class="f-ar" x1="180.0" y1="84" x2="180.0" y2="104" marker-end="url(#ah-leak-ai-attacker)"/><rect class="f-p" x="16" y="108" width="328" height="76" rx="12"/><text class="f-t" x="30" y="133">だましの文章を作る</text><text class="f-s" x="30" y="154">自然な日本語のニセメールを</text><text class="f-s" x="30" y="172">大量に作れる</text><line class="f-ar" x1="180.0" y1="186" x2="180.0" y2="206" marker-end="url(#ah-leak-ai-attacker)"/><rect class="f-p" x="16" y="210" width="328" height="76" rx="12"/><text class="f-t" x="30" y="235">ニセの顔や声を作る</text><text class="f-s" x="30" y="256">社長や上司になりすました</text><text class="f-s" x="30" y="274">動画・電話(ディープフェイク)</text><line class="f-ar" x1="180.0" y1="288" x2="180.0" y2="308" marker-end="url(#ah-leak-ai-attacker)"/><rect class="f-p" x="16" y="312" width="328" height="76" rx="12"/><text class="f-t" x="30" y="337">ウイルスを作る・変える</text><text class="f-s" x="30" y="358">動きながらAIに命令を作らせる</text><text class="f-s" x="30" y="376">ウイルスも見つかっている</text></svg>
