<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 276" role="img" aria-label="MCPを安全に使う4つの約束:知っている相手だけつなぐ、カギは必要な分だけ、大事な操作は確認してから、カギを人に見せない"><defs><marker id="ah-mcp-safety" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><rect class="f-o" x="16" y="6" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="28" r="12"/><text class="f-numt" x="38" y="32.5" text-anchor="middle">1</text><text class="f-t" x="60" y="31">知っている相手だけつなぐ</text><text class="f-s" x="60" y="52">信頼できる会社・人が作ったサーバーだけ</text><rect class="f-w" x="16" y="74" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="96" r="12"/><text class="f-numt" x="38" y="100.5" text-anchor="middle">2</text><text class="f-t" x="60" y="99">カギは必要な分だけわたす</text><text class="f-s" x="60" y="120">見るだけでいいなら「見る」だけの許可</text><rect class="f-o" x="16" y="142" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="164" r="12"/><text class="f-numt" x="38" y="168.5" text-anchor="middle">3</text><text class="f-t" x="60" y="167">大事な操作は確認してから</text><text class="f-s" x="60" y="188">消す・送る・書きかえる前に人が確認</text><rect class="f-w" x="16" y="210" width="328" height="58" rx="12"/><circle class="f-num" cx="38" cy="232" r="12"/><text class="f-numt" x="38" y="236.5" text-anchor="middle">4</text><text class="f-t" x="60" y="235">カギを人に見せない</text><text class="f-s" x="60" y="256">パスワードやキーを記事や共有に書かない</text></svg>
