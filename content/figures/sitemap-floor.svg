<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 212" role="img" aria-label="サイトマップのたとえ:Googleは廊下(リンク)をたどって部屋(ページ)を見つけるが、どこからも廊下がつながっていない部屋は見落としやすい。部屋の一覧表(サイトマップ)をわたすと見つけてもらいやすい"><defs><marker id="ah-sitemap-floor" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="f-ah"/></marker></defs><text class="f-l" x="16" y="20">廊下(リンク)をたどって部屋をさがす</text><rect class="f-b" x="16.0" y="30" width="76.0" height="44" rx="12"/><text class="f-t2" x="54.0" y="57" text-anchor="middle">トップ</text><line class="f-ar" x1="93.0" y1="52" x2="99.0" y2="52" marker-end="url(#ah-sitemap-floor)"/><rect class="f-b" x="100.0" y="30" width="76.0" height="44" rx="12"/><text class="f-t2" x="138.0" y="57" text-anchor="middle">記事A</text><line class="f-ar" x1="177.0" y1="52" x2="183.0" y2="52" marker-end="url(#ah-sitemap-floor)"/><rect class="f-b" x="184.0" y="30" width="76.0" height="44" rx="12"/><text class="f-t2" x="222.0" y="57" text-anchor="middle">記事B</text><rect class="f-o" x="268.0" y="30" width="76.0" height="44" rx="12"/><text class="f-t2" x="306.0" y="57" text-anchor="middle">記事C</text><text class="f-s2" x="16" y="96">▸ 記事Cはどこからもつながっていない → 見落としやすい</text><rect class="f-g" x="16" y="112" width="328" height="92" rx="12"/><text class="f-t" x="30" y="137">部屋の一覧表(サイトマップ)</text><text class="f-s" x="30" y="158">トップ・記事A・記事B・記事C …</text><text class="f-s" x="30" y="176">「この建物にはこの部屋があります」と</text><text class="f-s" x="30" y="194">まとめてわたす</text></svg>
